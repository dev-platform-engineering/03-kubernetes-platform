external_dns:
  interface: eth1
  vlan_id: 60

  group: ExternalDNS

  addresses:
    primary: 10.50.60.51
    secondary: 10.50.60.52
    vip: 10.50.60.53

  vrrp:
    vrid: 160

  forwarding:
    upstream_servers:
      - 192.168.13.2

    allow_from:
      - 10.50.0.0/16

    cache_size: 1000

external_ntp:
  interface: eth1
  vlan_id: 60

  group: ExternalNTP

  addresses:
    primary: 10.50.60.54
    secondary: 10.50.60.55
    vip: 10.50.60.56

  vrrp:
    vrid: 161

  forwarding:
    upstream_servers:
      - 192.168.13.101

    allow_from:
      - 10.50.0.0/16

external_proxy:
  interface: eth1
  upstream_interface: eth2
  vlan_id: 60
  group: ExternalProxy
  addresses:
    primary: 10.50.60.57
    secondary: 10.50.60.58
    vip: 10.50.60.59
  vrrp:
    vrid: 162
  forwarding:
    listen_port: 5555 # new port for client
    upstream_server: 192.168.13.101
    upstream_port: 55555 # upstream proxy port
    allow_from:
      - 10.50.0.0/16
