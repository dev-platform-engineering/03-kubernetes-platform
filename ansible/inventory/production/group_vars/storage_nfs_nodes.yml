---
dns_search:
  - infra.platform.internal
  - k8s.prod.platform.internal
  - platform.internal

proxy_enabled: false
repo_use_internal_repos: true
common_upgrade_packages: true

nfs_server_export_root: /srv/nfs
nfs_server_export_path: /srv/nfs/kubernetes

nfs_server_enable_nfsv3: false
nfs_server_port: 2049

nfs_server_allowed_clients:
  - 10.50.50.0/24

nfs_server_export_options:
  - rw
  - sync
  - root_squash
  - no_subtree_check

nfs_server_directories:
  - postgres
  - redis
  - postgres-test