---
dns_search:
  - infra.platform.internal
  - k8s.prod.platform.internal
  - platform.internal

proxy_enabled: false
repo_use_internal_repos: true
common_upgrade_packages: true

gitlab_hostname: "gitlab.infra.platform.internal"
gitlab_external_url: "http://{{ gitlab_hostname }}"

gitlab_rpm_url: >-
  http://repo-01.infra.platform.internal:8081/repository/platform-artifacts/gitlab/gitlab-ce.rpm

gitlab_rpm_sha256: ""

gitlab_rpm_path: "/var/tmp/gitlab-ce.rpm"

gitlab_manage_firewall: true