---
dns_search:
  - infra.platform.internal
  - k8s.prod.platform.internal
  - platform.internal

proxy_enabled: false
repo_use_internal_repos: true
common_upgrade_packages: true

# GitLab-specific setting
gitlab_proxy_enabled: true
# Internal Nexus repositories must bypass the proxy.
#dnf_internal_repo_proxy: "_none_"

gitlab_hostname: "gitlab.infra.platform.internal"
gitlab_external_url: "http://{{ gitlab_hostname }}"

gitlab_hostname: "gitlab.infra.platform.internal"
gitlab_external_url: "http://{{ gitlab_hostname }}"

gitlab_rpm_url: >-
  http://repo-01.infra.platform.internal:8081/repository/platform-artifacts/gitlab/gitlab-ce-19.5.1-ce.0.el9.x86_64.rpm

gitlab_gpg_key_url: >-
  http://repo-01.infra.platform.internal:8081/repository/platform-artifacts/gitlab/gitlab-package-signing-key.gpg

gitlab_rpm_sha256: "827b8ea1f109bbbca7b808d5a1d370a8cd1ebb60784973dda3ade0b7aa6bfc36"

# GitLab TLS
gitlab_tls_mode: self_signed
gitlab_tls_certificate_days: 365
gitlab_tls_key_size: 3072

gitlab_tls_directory: /etc/gitlab/ssl
gitlab_tls_cert_path: "{{ gitlab_tls_directory }}/{{ gitlab_hostname }}.crt"
gitlab_tls_key_path: "{{ gitlab_tls_directory }}/{{ gitlab_hostname }}.key"
gitlab_tls_csr_path: "{{ gitlab_tls_directory }}/{{ gitlab_hostname }}.csr"

gitlab_tls_validate_health_certificate: false
