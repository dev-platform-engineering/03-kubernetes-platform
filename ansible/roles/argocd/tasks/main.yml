
---
- name: Validate Argo CD bootstrap configuration
  ansible.builtin.assert:
    that:
      - argocd_helm_chart_version | length > 0
      - argocd_kubeconfig | length > 0
      - argocd_kubeconfig is match('^/')
    fail_msg: >-
      Set a pinned Argo CD Helm chart version and an absolute kubeconfig path.
  tags:
    - argocd
    - validate

- name: Verify Helm is installed
  ansible.builtin.command:
    argv:
      - helm
      - version
      - --short
  changed_when: false
  tags:
    - argocd
    - validate

- name: Verify Kubernetes API access
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ argocd_kubeconfig }}"
      - get
      - nodes
  changed_when: false
  tags:
    - argocd
    - validate

- name: Add the Argo Helm repository
  kubernetes.core.helm_repository:
    name: "{{ argocd_helm_repo_name }}"
    repo_url: "{{ argocd_helm_repo_url }}"
    state: present

- name: Render Argo CD Helm values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/argocd-values.yaml
    mode: "0600"

- name: Install or upgrade Argo CD
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: "{{ argocd_helm_chart_name }}"
    chart_version: "{{ argocd_helm_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    kubeconfig: "{{ argocd_kubeconfig }}"
    state: present
    wait: true
    timeout: "{{ argocd_install_timeout }}"

- name: Wait for Argo CD Pods to become Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ argocd_kubeconfig }}"
      - wait
      - --for=condition=Ready
      - pod
      - --all
      - --namespace
      - "{{ argocd_namespace }}"
      - "--timeout={{ argocd_install_timeout }}"
  changed_when: false

- name: Get Argo CD Pod status
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ argocd_kubeconfig }}"
      - get
      - pods
      - --namespace
      - "{{ argocd_namespace }}"
      - -o
      - wide
  changed_when: false
  register: argocd_pod_status

- name: Display Argo CD Pod status
  ansible.builtin.debug:
    var: argocd_pod_status.stdout_lines
