- name: Get active NetworkManager connection
  ansible.builtin.command:
    cmd: nmcli -t -f NAME,DEVICE connection show --active
  register: nm_active
  changed_when: false

- name: Check resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: resolv_conf

- name: Remove old resolv.conf from template
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - resolv_conf.stat.exists
    - not resolv_conf.stat.islnk | default(false)

- name: Configure NetworkManager DNS management
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/90-dns.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [main]
      dns=default
  notify: Restart NetworkManager

- name: Configure DNS
  community.general.nmcli:
    conn_name: "{{ nm_active.stdout.split(':')[0] }}"
    dns4: "{{ dns_servers }}"
    dns4_search: "{{ dns_search }}"
    dns4_ignore_auto: true
    state: present
  notify: Restart NetworkManager

- name: Remove cloud-init NetworkManager DNS override
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/99-cloud-init.conf
    state: absent
  notify: Restart NetworkManager
