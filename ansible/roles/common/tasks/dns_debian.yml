---
- name: DNS | Configure bootstrap resolv.conf
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for dns_server in dns_servers %}
      nameserver {{ dns_server }}
      {% endfor %}
      {% if dns_search | length > 0 %}
      search {{ dns_search | join(' ') }}
      {% endif %}

- name: DNS | Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
    update_cache: false

- name: DNS | Configure systemd-resolved
  ansible.builtin.template:
    src: debian_resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: DNS | Enable and start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true
    state: started

- name: DNS | Configure /etc/resolv.conf
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
