- name: Upgrade all system packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: true
  register: system_upgrade
  retries: 5
  delay: 30
  until: system_upgrade is succeeded

- name: Check if reboot is required
  ansible.builtin.command:
    cmd: needs-restarting -r
  register: reboot_required
  changed_when: false
  failed_when: false

- name: Reboot after system upgrade
  ansible.builtin.reboot:
    msg: "Rebooting because system upgrade requires reboot"
    reboot_timeout: 600
    connect_timeout: 10
    pre_reboot_delay: 5
    post_reboot_delay: 120
  when:
    - system_upgrade.changed
    - reboot_required.rc == 1
