- name: Find all existing default repo files
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "*.repo"
    excludes:
      - "internal-rocky-9-baseos.repo"
      - "internal-rocky-9-appstream.repo"
    file_type: file
  register: default_repos

- name: Create backup directory for default internet repos
  ansible.builtin.file:
    path: /etc/yum.repos.d/backup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Repositories | Move default repository files
  ansible.builtin.command:
    cmd: "mv {{ item.path }} /etc/yum.repos.d/backup/{{ item.path | basename }}"
  loop: "{{ default_repos.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: default_repos.files | length > 0
  changed_when: true

- name: Copy Rocky Linux 9 GPG key
  ansible.builtin.copy:
    src: RPM-GPG-KEY-Rocky-9
    dest: "{{ repo_rocky_local_gpg_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Import Rocky Linux 9 GPG key into RPM database
  ansible.builtin.rpm_key:
    state: present
    key: "{{ repo_rocky_local_gpg_path }}"

- name: Configure Rocky Linux 9 BaseOS repository
  ansible.builtin.yum_repository:
    name: internal-rocky-9-baseos
    description: Internal Rocky Linux 9 - BaseOS
    baseurl: "{{ repo_rocky_baseos_url }}"
    enabled: true
    gpgcheck: true
    gpgkey: "file://{{ repo_rocky_local_gpg_path }}"
    state: present

- name: Configure Rocky Linux 9 AppStream repository
  ansible.builtin.yum_repository:
    name: internal-rocky-9-appstream
    description: Internal Rocky Linux 9 - AppStream
    baseurl: "{{ repo_rocky_appstream_url }}"
    enabled: true
    gpgcheck: true
    gpgkey: "file://{{ repo_rocky_local_gpg_path }}"
    state: present

- name: Refresh DNF repository metadata
  ansible.builtin.dnf:
    update_cache: true

- name: Verify configured Rocky repositories
  ansible.builtin.command:
    cmd: dnf repolist
  register: dnf_repolist
  changed_when: false

- name: Display configured Rocky repositories
  ansible.builtin.debug:
    var: dnf_repolist.stdout_lines

- name: Verify BaseOS repository
  ansible.builtin.command:
    cmd: dnf repolist enabled internal-rocky-9-baseos
  register: baseos_repo_check
  changed_when: false
  failed_when: baseos_repo_check.rc != 0

- name: Verify AppStream repository
  ansible.builtin.command:
    cmd: dnf repolist enabled internal-rocky-9-appstream
  register: appstream_repo_check
  changed_when: false
  failed_when: appstream_repo_check.rc != 0
