---
# =============================================================================
# Vault TLS / PKI
#
# Security model:
#
#   - Vault CA private key exists ONLY on Ansible controller
#   - Vault node private keys are generated on the nodes themselves
#   - CSRs are generated on the nodes
#   - CSRs are signed on the Ansible controller
#   - signed certificates are copied back to the nodes
#   - CA certificate is distributed to all Vault nodes
#
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Create TLS directory on Vault node
# -----------------------------------------------------------------------------

- name: TLS | Create Vault PKI directory
  ansible.builtin.file:
    path: "{{ vault_tls_dir }}"
    state: directory
    owner: root
    group: "{{ vault_group }}"
    mode: "0750"

# -----------------------------------------------------------------------------
# 2. Create PKI directory on Ansible controller
# -----------------------------------------------------------------------------

- name: TLS | Create local Vault PKI directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

# -----------------------------------------------------------------------------
# 3. Create per-node PKI directory on Ansible controller
# -----------------------------------------------------------------------------

- name: TLS | Create local node PKI directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# =============================================================================
# VAULT CA
# =============================================================================

# -----------------------------------------------------------------------------
# 4. Generate Vault CA private key
# -----------------------------------------------------------------------------

- name: TLS | Generate Vault CA private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_ca_key_local }}"
    type: RSA
    size: "{{ vault_tls_ca_key_size }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

# -----------------------------------------------------------------------------
# 5. Generate Vault CA CSR
# -----------------------------------------------------------------------------

- name: TLS | Generate Vault CA CSR
  community.crypto.openssl_csr:
    path: "{{ vault_tls_controller_pki_dir }}/ca.csr"
    privatekey_path: "{{ vault_tls_ca_key_local }}"
    common_name: "{{ vault_tls_ca_common_name }}"
    digest: sha256

    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true

    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true

    subject:
      commonName: "{{ vault_tls_ca_common_name }}"
      organizationName: "Platform"
      organizationalUnitName: "Vault"

  delegate_to: localhost
  become: false
  run_once: true

# -----------------------------------------------------------------------------
# 6. Generate self-signed Vault CA certificate
# -----------------------------------------------------------------------------

- name: TLS | Generate Vault CA certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_ca_cert_local }}"
    csr_path: "{{ vault_tls_controller_pki_dir }}/ca.csr"
    privatekey_path: "{{ vault_tls_ca_key_local }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ vault_tls_ca_validity_days }}d"
    selfsigned_digest: sha256
  delegate_to: localhost
  become: false
  run_once: true

# =============================================================================
# SERVER CERTIFICATE
# =============================================================================

# -----------------------------------------------------------------------------
# 7. Generate Vault server private key on node
# -----------------------------------------------------------------------------

- name: TLS | Generate Vault server private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_server_key }}"
    type: RSA
    size: "{{ vault_tls_node_key_size }}"
    mode: "0640"
    owner: root
    group: "{{ vault_group }}"

# -----------------------------------------------------------------------------
# 8. Generate Vault server CSR
# -----------------------------------------------------------------------------

- name: TLS | Generate Vault server CSR
  community.crypto.openssl_csr:
    path: "{{ vault_tls_dir }}/server.csr"
    privatekey_path: "{{ vault_tls_server_key }}"
    common_name: "{{ vault_fqdn }}"
    digest: sha256

    basic_constraints:
      - "CA:FALSE"

    key_usage:
      - digitalSignature
      - keyEncipherment

    extended_key_usage:
      - serverAuth
      - clientAuth

    subject_alt_name:
      - "DNS:{{ vault_fqdn }}"
      - "DNS:{{ inventory_hostname }}"
      - "IP:{{ ansible_host }}"

# -----------------------------------------------------------------------------
# 9. Check local CSR on controller
# -----------------------------------------------------------------------------

- name: TLS | Check local Vault server CSR
  ansible.builtin.stat:
    path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.csr"
  register: vault_server_csr_local
  delegate_to: localhost
  become: false

# -----------------------------------------------------------------------------
# 10. Fetch CSR to controller
# -----------------------------------------------------------------------------

- name: TLS | Fetch Vault server CSR
  ansible.builtin.fetch:
    src: "{{ vault_tls_dir }}/server.csr"
    dest: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.csr"
    flat: true
  when: not vault_server_csr_local.stat.exists

# -----------------------------------------------------------------------------
# 11. Sign Vault server certificate
# -----------------------------------------------------------------------------

- name: TLS | Sign Vault server certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.crt"
    csr_path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.csr"
    ownca_path: "{{ vault_tls_ca_cert_local }}"
    ownca_privatekey_path: "{{ vault_tls_ca_key_local }}"
    provider: ownca
    ownca_not_after: "+{{ vault_tls_cert_validity_days }}d"
    ownca_digest: sha256
  delegate_to: localhost
  become: false

# =============================================================================
# INSTALL CERTIFICATES
# =============================================================================

# -----------------------------------------------------------------------------
# 12. Install Vault server certificate
# -----------------------------------------------------------------------------

- name: TLS | Install Vault server certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.crt"
    dest: "{{ vault_tls_server_cert }}"
    owner: root
    group: "{{ vault_group }}"
    mode: "0644"

# -----------------------------------------------------------------------------
# 13. Install Vault CA certificate
# -----------------------------------------------------------------------------

- name: TLS | Install Vault CA certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_ca_cert_local }}"
    dest: "{{ vault_tls_ca_cert }}"
    owner: root
    group: "{{ vault_group }}"
    mode: "0644"

# =============================================================================
# VALIDATION
# =============================================================================

# -----------------------------------------------------------------------------
# 14. Verify Vault server certificate
# -----------------------------------------------------------------------------

- name: TLS | Verify Vault server certificate
  ansible.builtin.command:
    cmd: >
      openssl verify
      -CAfile {{ vault_tls_ca_cert }}
      {{ vault_tls_server_cert }}
  register: vault_server_cert_verify
  changed_when: false
  failed_when: vault_server_cert_verify.rc != 0

# -----------------------------------------------------------------------------
# 15. Display Vault certificate information
# -----------------------------------------------------------------------------

- name: TLS | Display Vault server certificate information
  ansible.builtin.command:
    cmd: >
      openssl x509
      -in {{ vault_tls_server_cert }}
      -noout
      -subject
      -issuer
      -dates
      -ext subjectAltName
      -ext extendedKeyUsage
  register: vault_server_cert_info
  changed_when: false

- name: TLS | Debug Vault server certificate information
  ansible.builtin.debug:
    var: vault_server_cert_info.stdout_lines
