- name: Download etcd archive
  ansible.builtin.get_url:
    url: "{{ etcd_artifact_url }}"
    dest: "/tmp/{{ etcd_archive }}"
    mode: "0644"
    checksum: "{{ etcd_artifact_checksum }}"

- name: Extract etcd archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ etcd_archive }}"
    dest: "/tmp"
    remote_src: true

- name: Install etcd binary
  ansible.builtin.copy:
    src: "/tmp/etcd-{{ etcd_version }}-{{ etcd_arch }}/etcd"
    dest: "{{ etcd_bin_dir }}/etcd"
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Install etcdctl binary
  ansible.builtin.copy:
    src: "/tmp/etcd-{{ etcd_version }}-{{ etcd_arch }}/etcdctl"
    dest: "{{ etcd_bin_dir }}/etcdctl"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
