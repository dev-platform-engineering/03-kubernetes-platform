---
- name: Directories | Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0700"

- name: Directories | Create etcd configuration directory
  ansible.builtin.file:
    path: "{{ etcd_config_dir }}"
    state: directory
    owner: root
    group: "{{ etcd_group }}"
    mode: "0750"

- name: Directories | Ensure etcd binary directory exists
  ansible.builtin.file:
    path: "{{ etcd_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
