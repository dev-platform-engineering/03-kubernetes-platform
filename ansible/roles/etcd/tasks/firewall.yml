- name: Firewall | Allow etcd client port
  ansible.posix.firewalld:
    port: "{{ etcd_client_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Firewall | Allow etcd peer port
  ansible.posix.firewalld:
    port: "{{ etcd_peer_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
