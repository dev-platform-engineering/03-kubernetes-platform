
---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_os_family in nfs_client_packages_by_os
    fail_msg: >-
      Unsupported OS family {{ ansible_os_family }}
      for NFS client setup.

- name: Install NFS client packages
  ansible.builtin.package:
    name: "{{ nfs_client_packages_by_os[ansible_os_family] }}"
    state: present

- name: Verify NFS server TCP connectivity
  ansible.builtin.wait_for:
    host: "{{ nfs_client_server }}"
    port: "{{ nfs_client_port }}"
    state: started
    timeout: 10
  changed_when: false

- name: Ensure NFS smoke-test mountpoint exists
  ansible.builtin.file:
    path: "{{ nfs_client_test_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nfs_client_run_smoke_test | bool

- name: Mount NFS export for smoke test
  ansible.posix.mount:
    path: "{{ nfs_client_test_mountpoint }}"
    src: "{{ nfs_client_server }}:{{ nfs_client_test_export }}"
    fstype: nfs
    opts: "rw,vers={{ nfs_client_version }},proto=tcp"
    state: ephemeral
  when: nfs_client_run_smoke_test | bool

- name: Verify NFS export is accessible
  ansible.builtin.stat:
    path: "{{ nfs_client_test_mountpoint }}"
  register: nfs_client_mount_stat
  when: nfs_client_run_smoke_test | bool

- name: Verify NFS export is mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ nfs_client_test_mountpoint }}"
  changed_when: false
  when: nfs_client_run_smoke_test | bool

- name: Unmount NFS smoke-test export
  ansible.posix.mount:
    path: "{{ nfs_client_test_mountpoint }}"
    state: unmounted
  when: nfs_client_run_smoke_test | bool
