---
# ==========================================================
# Cilium BGP
# ==========================================================

- name: Cilium BGP | Build peer configuration
  ansible.builtin.set_fact:
    cilium_bgp_peer_config: >-
      {{
        cilium_bgp_peer_config | default([]) +
        [{
          'name': item.name,
          'peerASN': item.as,
          'peerAddress': item.address,
          'peerConfigRef': {
            'name': 'kubernetes-bgp-peer'
          }
        }]
      }}
  loop: "{{ kubernetes_bgp_peers }}"
  delegate_to: localhost
  # run_once: true

# ----------------------------------------------------------
# Peer policy
# ----------------------------------------------------------

- name: Cilium BGP | Configure peer policy
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_local_path }}"
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumBGPPeerConfig
      metadata:
        name: kubernetes-bgp-peer
        namespace: kube-system
      spec:
        timers:
          holdTimeSeconds: 90
          keepAliveTimeSeconds: 30

        ebgpMultihop: 1

        gracefulRestart:
          enabled: true
          restartTimeSeconds: 120
        families:
          - afi: ipv4
            safi: unicast
            advertisements:
              matchLabels:
                advertise: pod-cidr
  delegate_to: localhost
  run_once: true

# ----------------------------------------------------------
# BGP cluster configuration
# ----------------------------------------------------------

# ----------------------------------------------------------
# BGP cluster configuration
# ----------------------------------------------------------
- name: Cilium BGP | Configure node-specific BGP clusters
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_local_path }}"
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumBGPClusterConfig
      metadata:
        name: "kubernetes-bgp-{{ host }}"
      spec:
        nodeSelector:
          matchLabels:
            kubernetes.io/hostname: "{{ host }}"
        bgpInstances:
          - name: "{{ host }}"
            localASN: "{{ hostvars[host]['cilium_bgp_local_as'] | default(cilium_bgp_local_as) | int }}"
            peers: >-
              {{ hostvars[host]['cilium_bgp_peer_config'] }}
  loop: "{{ groups['kubernetes_bgp_nodes'] }}"
  loop_control:
    loop_var: host
  delegate_to: localhost
  run_once: true

