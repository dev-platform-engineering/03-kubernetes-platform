# ----------------------------------------------------------
# Pod CIDR advertisement
# ----------------------------------------------------------

- name: Cilium BGP | Configure Pod CIDR advertisement
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_local_path }}"
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumBGPAdvertisement
      metadata:
        name: pod-cidr
        namespace: kube-system
        labels:
          advertise: pod-cidr
      spec:
        advertisements:
          - advertisementType: PodCIDR
  delegate_to: localhost
  run_once: true
