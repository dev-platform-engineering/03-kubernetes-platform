---
- name: Install Nexus host prerequisites
  ansible.builtin.dnf:
    name:
      - curl
      - ca-certificates
      - tar
      - gzip
    state: present

- name: Add Docker CE repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"
  environment:
    http_proxy: "{{ inet_proxy.http_proxy }}"
    https_proxy: "{{ inet_proxy.https_proxy }}"
    no_proxy: "{{ inet_proxy.no_proxy | join(',') }}"

- name: Install Docker CE
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Check Docker service
  ansible.builtin.service_facts:

- name: Verify Docker is installed
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
    fail_msg: >-
      Docker is required by the repo role but docker.service
      is not installed on {{ inventory_hostname }}.

- name: Verify Docker is running
  ansible.builtin.assert:
    that:
      - ansible_facts.services['docker.service'].state == 'running'
    fail_msg: >-
      Docker is installed but not running on {{ inventory_hostname }}.

- name: Create Nexus data directory
  ansible.builtin.file:
    path: "{{ repo_nexus_data_path }}"
    state: directory
    owner: root
    group: root
    mode: "0775"
