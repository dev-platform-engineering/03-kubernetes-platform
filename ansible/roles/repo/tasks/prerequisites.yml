---
- name: Install Nexus host prerequisites
  ansible.builtin.dnf:
    name:
      - curl
      - ca-certificates
      - tar
      - gzip
    state: present

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create Nexus data directory
  ansible.builtin.file:
    path: "{{ repo_nexus_data_path }}"
    state: directory
    owner: root
    group: root
    mode: "0775"
