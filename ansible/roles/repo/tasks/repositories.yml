---
# -----------------------------------------------------------------------------
# Rocky Linux 9 - BaseOS
# -----------------------------------------------------------------------------

- name: Check Rocky BaseOS repository
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/repositories/yum/proxy/{{ repo_nexus_rocky_baseos.name }}"
    method: GET
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    status_code:
      - 200
      - 404
    validate_certs: false
  register: repo_nexus_rocky_baseos_check
  when: repo_nexus_rocky_enabled | bool
  no_log: true

- name: Create Rocky BaseOS repository
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/repositories/yum/proxy"
    method: POST
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ repo_nexus_rocky_baseos.name }}"
      online: true

      storage:
        blobStoreName: default
        strictContentTypeValidation: true

      proxy:
        remoteUrl: "{{ repo_nexus_rocky_baseos.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 60

      negativeCache:
        enabled: true
        timeToLive: 1440

      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 3
          timeout: 60

    status_code: 201
    validate_certs: false
  when:
    - repo_nexus_rocky_enabled | bool
    - repo_nexus_rocky_baseos_check.status == 404

