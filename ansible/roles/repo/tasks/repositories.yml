---
- name: Repository Configuration Block
  become: true
  environment:
    http_proxy: "{{ inet_proxy.http_proxy }}"
    https_proxy: "{{ inet_proxy.https_proxy }}"
    no_proxy: "{{ inet_proxy.no_proxy | join(',') }}"
  block:
    - name: Configure Rocky Linux repository
      ansible.builtin.include_tasks:
        file: rocky.yml
      when: repo_rocky_enabled | bool
