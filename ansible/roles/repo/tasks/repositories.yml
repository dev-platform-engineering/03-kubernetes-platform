#----
# Docker repo
#----

- name: Check Docker repositories
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/repositories/docker/proxy/{{ item.name }}"
    method: GET
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    status_code:
      - 200
      - 404
    validate_certs: false
  register: repo_nexus_docker_checks
  loop: "{{ repo_nexus_docker_proxies }}"
  loop_control:
    label: "{{ item.name }}"
  when: repo_nexus_docker_enabled | bool
  no_log: false

- name: Create Docker Proxy repository
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/repositories/docker/proxy"
    method: POST
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ item.item.name }}"
      online: true

      storage:
        blobStoreName: default
        strictContentTypeValidation: true

      proxy:
        remoteUrl: "{{ item.item.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 1440

      negativeCache:
        enabled: true
        timeToLive: 1440

      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 3
          timeout: 60

      dockerProxy:
        indexType: "{{ item.item.index_type }}"

      docker:
        v1Enabled: false
        forceBasicAuth: false
        httpPort: "{{ item.item.http_port }}"
    status_code: 201
    validate_certs: false

  loop: "{{ repo_nexus_docker_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - repo_nexus_docker_enabled | bool
    - item.status == 404
  no_log: true

