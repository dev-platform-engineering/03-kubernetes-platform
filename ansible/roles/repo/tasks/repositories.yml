  loop_control:
    label: "{{ item.name | default('undefined') }}"
  register: repo_nexus_k8s_checks
  no_log: true

- name: Create Kubernetes APT proxy repositories
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/repositories/apt/proxy"
    method: POST
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.item.name }}"
      online: true

      storage:
        blobStoreName: default
        strictContentTypeValidation: true

      proxy:
        remoteUrl: "{{ item.item.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 60

      negativeCache:
        enabled: true
        timeToLive: 1440

      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 3
          timeout: 60

      apt:
        distribution: "{{ item.item.distribution }}"
        flat: "{{ item.item.flat }}"
        enforceDistribution: "{{ item.item.enforce_distribution }}"

    status_code: 201
    validate_certs: false
  loop: "{{ repo_nexus_k8s_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status == 404

- name: Configure Nexus anonymous access
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/security/anonymous"
    method: PUT
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      enabled: "{{ repo_nexus_anonymous_access_enabled }}"
    status_code:
      - 200
      - 204
    validate_certs: false
  no_log: true

- name: Configure Docker insecure registries
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: >
      {{ 
        {
          'insecure-registries': docker_insecure_registries
        } | to_nice_json 
      }}
  notify: Restart Docker

- name: Wait for Nexus to completely start up and open ports
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 8082
    delay: 5
    timeout: 120
    state: started

- name: Get current active security realms
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/security/realms/active"
    method: GET
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: current_nexus_realms
  no_log: true

- name: Debug current active realms
  ansible.builtin.debug:
    msg: "Current active realms: {{ current_nexus_realms.json }}"

- name: Activate Docker Bearer Token Realm
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/rest/v1/security/realms/active"
    method: PUT
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: raw
    body: >-
      {{
        (
          current_nexus_realms.json
          | default([])
          | union(['DockerToken'])
        )
        | to_json
      }}
    status_code: 204
    validate_certs: false
  no_log: true
