- name: Give Nexus extra time to initialize web services
  ansible.builtin.pause:
    seconds: 5

- name: Configure Nexus global HTTP/HTTPS proxy via ExtDirect
  ansible.builtin.uri:
    url: "{{ repo_nexus_api_url }}/service/extdirect"
    method: POST
    user: "{{ repo_nexus_admin_user }}"
    password: "{{ repo_nexus_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      action: "coreui_HttpSettings"
      method: "update"
      tid: 42
      type: "rpc"
      data:
        - httpEnabled: "{{ repo_nexus_http_proxy_enabled }}"
          httpHost: "{{ repo_nexus_http_proxy_host }}"
          httpPort: "{{ repo_nexus_http_proxy_port }}"
          httpsEnabled: "{{ repo_nexus_https_proxy_enabled }}"
          httpsHost: "{{ repo_nexus_https_proxy_host }}"
          httpsPort: "{{ repo_nexus_https_proxy_port }}"

          httpAuthEnabled: "{{ repo_nexus_http_proxy_auth_enabled }}"
          httpAuthUsername: "{{ repo_nexus_http_proxy_username }}"
          httpAuthPassword: "{{ repo_nexus_http_proxy_password }}"

          httpsAuthEnabled: "{{ repo_nexus_https_proxy_auth_enabled }}"
          httpsAuthUsername: "{{ repo_nexus_https_proxy_username }}"
          httpsAuthPassword: "{{ repo_nexus_https_proxy_password }}"

          ntlmHost: ""
          ntlmDomain: ""

          nonProxyHosts: "{{ repo_nexus_proxy_non_proxy_hosts }}"

          userAgentCustomization: "{{ repo_nexus_http_user_agent }}"
          connectionTimeout: "{{ repo_nexus_http_timeout }}"
          requestTimeout: "{{ repo_nexus_http_timeout }}"
    status_code: 200
    validate_certs: false
  register: repo_nexus_proxy_result
  #no_log: true

- name: Verify Nexus proxy configuration
  ansible.builtin.assert:
    that:
      - repo_nexus_proxy_result.json.result.success | default(false) | bool
    fail_msg: >-
      Nexus ExtDirect proxy configuration failed:
      {{ repo_nexus_proxy_result.json | default(repo_nexus_proxy_result.content) }}
    success_msg: "Nexus global HTTP/HTTPS proxy configured successfully."
