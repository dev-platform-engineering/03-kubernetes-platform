---
- name: Configure repository server
  when: repo_enabled | bool
  become: true
  block:
    - name: Run repository prerequisites
      ansible.builtin.include_tasks:
        file: prerequisites.yml

    - name: Configure Pulp
      ansible.builtin.include_tasks:
        file: pulp.yml
        apply:
          environment:
            http_proxy: "{{ inet_proxy.http_proxy }}"
            https_proxy: "{{ inet_proxy.https_proxy }}"
            no_proxy: "{{ inet_proxy.no_proxy | join(',') }}"
      vars:
        pulp_python_interpreter: "/usr/bin/python3.11"

    - name: Verify Pulp
      ansible.builtin.include_tasks:
        file: verify.yml

    - name: Configure repositories
      ansible.builtin.include_tasks:
        file: repositories.yml
        apply:
          environment:
            http_proxy: "{{ inet_proxy.http_proxy }}"
            https_proxy: "{{ inet_proxy.https_proxy }}"
            no_proxy: "{{ inet_proxy.no_proxy | join(',') }}"
