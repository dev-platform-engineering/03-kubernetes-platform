- name: Configure DHCP pools
  vyos.vyos.vyos_config:
    lines: |
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} subnet-id {{ item.id }}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} option default-router {{ item.vrrp.vip }}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} lease {{ item.dhcp.lease | default(86400) }}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} range 0 start {{ item.subnet }}.{{ item.dhcp.range.start }}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} range 0 stop {{ item.subnet }}.{{ item.dhcp.range.stop }}
      {% if item.dns_servers is defined %}
      {% if item.dns_servers is string %}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} option name-server {{ item.dns_servers }}
      {% else %}
      {% for dns in item.dns_servers %}
      set service dhcp-server shared-network-name VLAN{{ item.id }} subnet {{ item.network }} option name-server {{ dns }}
      {% endfor %}
      {% endif %}
      {% endif %}

  loop: "{{ vgt_vlans }}"
  when:
    - item.dhcp is defined
    - item.dhcp.enabled | bool
