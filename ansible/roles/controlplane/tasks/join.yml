---
- name: Controlplane | Check whether node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: controlplane_kubelet_conf

- name: Controlplane | Join control plane
  ansible.builtin.command:
    cmd: kubeadm join --config /etc/kubernetes/kubeadm-config.yaml
  when: not controlplane_kubelet_conf.stat.exists
  register: controlplane_kubeadm_join
  changed_when: true
  #no_log: true
