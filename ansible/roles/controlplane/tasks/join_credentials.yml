---
- name: Controlplane | Upload control-plane certificates
  ansible.builtin.command:
    cmd: >-
      kubeadm init phase upload-certs
      --config /etc/kubernetes/kubeadm-config.yaml
      --upload-certs
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  run_once: true
  register: controlplane_upload_certs
  changed_when: false
  no_log: true

- name: Controlplane | Store certificate key
  ansible.builtin.set_fact:
    controlplane_certificate_key: >-
      {{
        controlplane_upload_certs.stdout_lines
        | select('match', '^[0-9a-fA-F]{64}$')
        | list
        | first
      }}
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  delegate_facts: true
  run_once: true
  no_log: true

- name: Controlplane | Generate bootstrap token
  ansible.builtin.command:
    cmd: kubeadm token create
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  run_once: true
  register: controlplane_token
  changed_when: false
  no_log: true

- name: Controlplane | Store bootstrap token
  ansible.builtin.set_fact:
    controlplane_join_token: "{{ controlplane_token.stdout }}"
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  delegate_facts: true
  run_once: true
  no_log: true

- name: Controlplane | Calculate CA certificate hash
  ansible.builtin.shell:
    cmd: >-
      openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
      openssl rsa -pubin -outform der 2>/dev/null |
      openssl dgst -sha256 -hex |
      awk '{print $2}'
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  run_once: true
  register: controlplane_ca_hash
  changed_when: false
  no_log: true

- name: Controlplane | Store CA certificate hash
  ansible.builtin.set_fact:
    controlplane_ca_cert_hash: "{{ controlplane_ca_hash.stdout }}"
  delegate_to: "{{ kubeadm_bootstrap_host }}"
  delegate_facts: true
  run_once: true
  no_log: true

- name: Controlplane | Validate join credentials
  ansible.builtin.assert:
    that:
      - hostvars[kubeadm_bootstrap_host].controlplane_join_token is defined
      - hostvars[kubeadm_bootstrap_host].controlplane_join_token | length > 0
      - hostvars[kubeadm_bootstrap_host].controlplane_ca_cert_hash is defined
      - hostvars[kubeadm_bootstrap_host].controlplane_ca_cert_hash | length == 64
      - hostvars[kubeadm_bootstrap_host].controlplane_certificate_key is defined
      - hostvars[kubeadm_bootstrap_host].controlplane_certificate_key | length == 64
    fail_msg: "Kubeadm control-plane join credentials were not generated correctly"
  run_once: true
