---
- name: Controlplane | Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  run_once: true

- name: Controlplane | Fetch admin kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true
  become: true
  run_once: true

- name: Controlplane | Configure KUBECONFIG environment
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    regexp: "^export KUBECONFIG="
    line: 'export KUBECONFIG="{{ kubeconfig_local_path }}"'
    state: present
    create: true
  delegate_to: localhost
  run_once: true
