---
# ----------------------------------------------------------
# Kubernetes | RedHat firewall
#
# Applies to Rocky/RHEL-based Kubernetes nodes.
#
# Responsibilities:
#   - Host access
#   - Cilium health connectivity
#   - Cilium native-routing Pod forwarding
#
# Debian nodes use firewall_debian.yml.
# ----------------------------------------------------------

# ----------------------------------------------------------
# firewalld
# ----------------------------------------------------------

- name: Kubernetes | Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Kubernetes | Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

# ----------------------------------------------------------
# Host access
# ----------------------------------------------------------

- name: Kubernetes | Allow Control Plane -> Kubelet
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_control_plane_cidr }}"
      port port="{{ kubernetes_kubelet_port }}"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

- name: Kubernetes | Allow Control Plane -> Cilium health
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_control_plane_cidr }}"
      port port="4240"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

- name: Kubernetes | Allow Worker -> Worker Cilium health
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_worker_cidr }}"
      port port="4240"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

# ----------------------------------------------------------
# Cilium forwarding policy
#
# Native routing:
#
#   Worker network
#       10.50.50.0/24
#              |
#              | forwarded traffic
#              v
#       Cilium Pod network
#       10.60.0.0/16
#
# The policy uses:
#
#   ingress: public
#   egress:  ANY
#   target:   CONTINUE
#
# This is intentionally NOT a blanket ACCEPT policy.
# Only the explicit source/destination rich rules below
# are accepted.
# ----------------------------------------------------------

- name: Kubernetes | Check Cilium firewalld policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --get-policies
  register: kubernetes_cilium_policy_list
  changed_when: false

- name: Kubernetes | Create Cilium firewalld policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --new-policy cilium-forward
  when: "'cilium-forward' not in kubernetes_cilium_policy_list.stdout"
  changed_when: true

# ----------------------------------------------------------
# Policy zones
# ----------------------------------------------------------

- name: Kubernetes | Check Cilium policy ingress zones
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --get-ingress-zones
  register: kubernetes_cilium_policy_ingress_zones
  changed_when: false

- name: Kubernetes | Add public ingress zone to Cilium policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --add-ingress-zone public
  when: "'public' not in kubernetes_cilium_policy_ingress_zones.stdout"
  changed_when: true

- name: Kubernetes | Check Cilium policy egress zones
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --get-egress-zones
  register: kubernetes_cilium_policy_egress_zones
  changed_when: false

- name: Kubernetes | Add ANY egress zone to Cilium policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --add-egress-zone ANY
  when: "'ANY' not in kubernetes_cilium_policy_egress_zones.stdout"
  changed_when: true

# ----------------------------------------------------------
# Policy target
# ----------------------------------------------------------

- name: Kubernetes | Check Cilium policy target
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --get-target
  register: kubernetes_cilium_policy_target
  changed_when: false

- name: Kubernetes | Set Cilium policy target to CONTINUE
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --set-target CONTINUE
  when: kubernetes_cilium_policy_target.stdout | trim != "CONTINUE"
  changed_when: true

# ----------------------------------------------------------
# Worker network -> Pod network
# ----------------------------------------------------------

- name: Kubernetes | Check Worker -> Pod forwarding rule
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --list-rich-rules
  register: kubernetes_cilium_policy_rules
  changed_when: false

- name: Kubernetes | Allow Worker network -> Cilium Pod network
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent
      --policy cilium-forward
      --add-rich-rule='rule family="ipv4"
      source address="{{ kubernetes_worker_cidr }}"
      destination address="{{ cilium_cluster_pool_ipv4_cidr }}"
      accept'
  when: >-
    ('source address="' ~ kubernetes_worker_cidr ~ '"')
    not in kubernetes_cilium_policy_rules.stdout
    or
    ('destination address="' ~ cilium_cluster_pool_ipv4_cidr ~ '"')
    not in kubernetes_cilium_policy_rules.stdout
  changed_when: true

# ----------------------------------------------------------
# Pod network -> Worker network
# ----------------------------------------------------------

- name: Kubernetes | Check Pod -> Worker forwarding rule
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --list-rich-rules
  register: kubernetes_cilium_policy_rules_reverse
  changed_when: false

- name: Kubernetes | Allow Cilium Pod network -> Worker network
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent
      --policy cilium-forward
      --add-rich-rule='rule family="ipv4"
      source address="{{ cilium_cluster_pool_ipv4_cidr }}"
      destination address="{{ kubernetes_worker_cidr }}"
      accept'
  when: >-
    ('source address="' ~ cilium_cluster_pool_ipv4_cidr ~ '"')
    not in kubernetes_cilium_policy_rules_reverse.stdout
    or
    ('destination address="' ~ kubernetes_worker_cidr ~ '"')
    not in kubernetes_cilium_policy_rules_reverse.stdout
  changed_when: true

# ----------------------------------------------------------
# Apply configuration
# ----------------------------------------------------------

- name: Kubernetes | Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
