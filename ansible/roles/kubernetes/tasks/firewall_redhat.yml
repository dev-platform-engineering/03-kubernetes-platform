---
# ----------------------------------------------------------
# Kubernetes | RedHat firewall
# ----------------------------------------------------------
#
# Applies to:
#   - Rocky Linux
#   - RHEL
#
# Responsibilities:
#   - Control Plane -> Kubelet
#   - Control Plane -> Cilium health
#   - Worker -> Worker Cilium health
#   - Cilium native-routing Pod forwarding
#
# Cilium:
#   Native routing CIDR: 10.60.0.0/16
#   Cluster pool CIDR:   10.60.0.0/16
#
# Kubernetes worker network:
#   10.50.50.0/24
#
# ----------------------------------------------------------

# ----------------------------------------------------------
# firewalld
# ----------------------------------------------------------

- name: Kubernetes | Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Kubernetes | Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

# ----------------------------------------------------------
# Host access
# ----------------------------------------------------------

- name: Kubernetes | Allow Control Plane -> Kubelet
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_control_plane_cidr }}"
      port port="{{ kubernetes_kubelet_port }}"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

- name: Kubernetes | Allow Control Plane -> Cilium health
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_control_plane_cidr }}"
      port port="4240"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

- name: Kubernetes | Allow Worker -> Worker Cilium health
  ansible.posix.firewalld:
    zone: public
    rich_rule: >-
      rule family="ipv4"
      source address="{{ kubernetes_worker_cidr }}"
      port port="4240"
      protocol="tcp"
      accept
    permanent: true
    immediate: true
    state: enabled

# ----------------------------------------------------------
# Cilium forwarding policy
# ----------------------------------------------------------
#
# We use a firewalld policy because Cilium Pod traffic is
# forwarded through the worker host.
#
# The diagnostic policy that proved the problem was:
#
#   public -> ANY
#   target ACCEPT
#
# We do NOT keep that broad ACCEPT policy.
#
# Instead:
#
#   public -> ANY
#   target CONTINUE
#
# and explicitly allow:
#
#   worker CIDR -> Pod CIDR
#   Pod CIDR    -> worker CIDR
#
# ----------------------------------------------------------

- name: Kubernetes | Check firewalld policies
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --get-policies
  register: kubernetes_firewalld_policies
  changed_when: false

- name: Kubernetes | Create Cilium forwarding policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --new-policy cilium-forward
  when: "'cilium-forward' not in kubernetes_firewalld_policies.stdout.split()"
  changed_when: true

# ----------------------------------------------------------
# Get current policy configuration
# ----------------------------------------------------------

- name: Kubernetes | Get Cilium forwarding policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --list-all
  register: kubernetes_cilium_policy
  changed_when: false

# ----------------------------------------------------------
# Policy zones
# ----------------------------------------------------------

- name: Kubernetes | Add public ingress zone to Cilium policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --add-ingress-zone public
  when: >-
    'ingress-zones: public' not in kubernetes_cilium_policy.stdout
  changed_when: true

- name: Kubernetes | Add ANY egress zone to Cilium policy
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --add-egress-zone ANY
  when: >-
    'egress-zones: ANY' not in kubernetes_cilium_policy.stdout
  changed_when: true

# ----------------------------------------------------------
# Policy target
# ----------------------------------------------------------

- name: Kubernetes | Get Cilium policy target
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --get-target
  register: kubernetes_cilium_policy_target
  changed_when: false

- name: Kubernetes | Set Cilium policy target to CONTINUE
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --set-target CONTINUE
  when:
    - kubernetes_cilium_policy_target.stdout | trim != "CONTINUE"
  changed_when: true

# ----------------------------------------------------------
# Policy rich rules
# ----------------------------------------------------------

- name: Kubernetes | Get Cilium policy rich rules
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --policy cilium-forward --list-rich-rules
  register: kubernetes_cilium_policy_rules
  changed_when: false

# ----------------------------------------------------------
# Worker -> Pod
# ----------------------------------------------------------

- name: Kubernetes | Allow Worker network -> Cilium Pod network
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent
      --policy cilium-forward
      --add-rich-rule='rule family="ipv4"
      source address="{{ kubernetes_worker_cidr }}"
      destination address="{{ cilium_cluster_pool_ipv4_cidr }}"
      accept'
  when: >-
    ('source address="' ~ kubernetes_worker_cidr ~
    '" destination address="' ~ cilium_cluster_pool_ipv4_cidr ~
    '" accept')
    not in kubernetes_cilium_policy_rules.stdout
  changed_when: true

# ----------------------------------------------------------
# Pod -> Worker
# ----------------------------------------------------------

- name: Kubernetes | Allow Cilium Pod network -> Worker network
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent
      --policy cilium-forward
      --add-rich-rule='rule family="ipv4"
      source address="{{ cilium_cluster_pool_ipv4_cidr }}"
      destination address="{{ kubernetes_worker_cidr }}"
      accept'
  when: >-
    ('source address="' ~ cilium_cluster_pool_ipv4_cidr ~
    '" destination address="' ~ kubernetes_worker_cidr ~
    '" accept')
    not in kubernetes_cilium_policy_rules.stdout
  changed_when: true

# ----------------------------------------------------------
# Apply configuration
# ----------------------------------------------------------

- name: Kubernetes | Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
