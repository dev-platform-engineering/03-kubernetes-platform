---
- name: Kubernetes | Install and configure containerd
  block:
    # -------------------------------------------------------------------------
    # Download
    # -------------------------------------------------------------------------

    - name: Kubernetes | Download containerd archive
      ansible.builtin.get_url:
        url: "{{ containerd_artifact_url }}"
        dest: "/tmp/{{ containerd_archive }}"
        checksum: "{{ containerd_artifact_checksums[containerd_version] }}"
        owner: root
        group: root
        mode: "0644"

    # -------------------------------------------------------------------------
    # Installation
    # -------------------------------------------------------------------------

    - name: Kubernetes | Extract containerd archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ containerd_archive }}"
        dest: /usr/local
        remote_src: true
        owner: root
        group: root

    # -------------------------------------------------------------------------
    # Configuration
    # -------------------------------------------------------------------------

    - name: Kubernetes | Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # NEW:
    # Create the directory used by containerd for per-registry hosts.toml files.
    - name: Kubernetes | Create containerd registry configuration directory
      ansible.builtin.file:
        path: /etc/containerd/certs.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Kubernetes | Check containerd configuration
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Kubernetes | Generate default containerd configuration
      ansible.builtin.shell:
        cmd: /usr/local/bin/containerd config default > /etc/containerd/config.toml
      when: not containerd_config.stat.exists
      changed_when: true
      notify: Restart containerd

    - name: Kubernetes | Configure systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"
      notify: Restart containerd

    - name: Kubernetes | Configure containerd registry config path
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'config_path = ""'
        replace: 'config_path = "/etc/containerd/certs.d"'
      notify: Restart containerd

    - name: Kubernetes | Configure containerd sandbox image
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'sandbox_image = "registry.k8s.io/pause:[^"]+"'
        replace: 'sandbox_image = "{{ kubernetes_containerd_sandbox_image }}"'
      notify: Restart containerd

    - name: Kubernetes | Create containerd registry configuration directory
      ansible.builtin.file:
        path: /etc/containerd/certs.d/registry.k8s.io
        state: directory
        owner: root
        group: root
        mode: "0755"

    # - name: Kubernetes | Configure registry.k8s.io Nexus mirror
    #   ansible.builtin.copy:
    #     dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    #     owner: root
    #     group: root
    #     mode: "0644"
    #     content: |
    #       server = "https://registry.k8s.io"

    #       [host."{{ kubernetes_registry_k8s_endpoint }}"]
    #         capabilities = ["pull", "resolve"]
    #   notify: Restart containerd
    # CHANGED:
    # Use the Nexus Docker connector on port 8083.
    #
    # Do not use:
    # http://repo-01.infra.platform.internal:8081/repository/registry-k8s-io
    #
    # That is a Nexus repository/content URL, not the Docker connector.
    - name: Kubernetes | Configure registry.k8s.io Nexus mirror
      ansible.builtin.copy:
        dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
        owner: root
        group: root
        mode: "0644"
        content: |
          server = "https://registry.k8s.io"

          [host."{{ kubernetes_registry_k8s_docker_endpoint }}"]
            capabilities = ["pull", "resolve"]
      notify: Restart containerd

    # =========================================================================
    # quay.io mirror for Cilium
    # =========================================================================

    # NEW:
    # Cilium images originate from quay.io, so it needs its own hosts.toml.
    - name: Kubernetes | Create quay.io configuration directory
      ansible.builtin.file:
        path: /etc/containerd/certs.d/quay.io
        state: directory
        owner: root
        group: root
        mode: "0755"

    # NEW:
    # Use the Nexus Docker connector on port 8084.
    - name: Kubernetes | Configure quay.io Nexus mirror
      ansible.builtin.copy:
        dest: /etc/containerd/certs.d/quay.io/hosts.toml
        owner: root
        group: root
        mode: "0644"
        content: |
          server = "https://quay.io"

          [host."{{ kubernetes_registry_quay_docker_endpoint }}"]
            capabilities = ["pull", "resolve"]
      notify: Restart containerd

    # -------------------------------------------------------------------------
    # Systemd
    # -------------------------------------------------------------------------

    - name: Kubernetes | Install containerd systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/containerd.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=containerd container runtime
          Documentation=https://containerd.io
          After=network.target local-fs.target

          [Service]
          ExecStartPre=-/sbin/modprobe overlay
          ExecStart=/usr/local/bin/containerd
          Type=notify
          Delegate=yes
          KillMode=process
          Restart=always
          RestartSec=5
          LimitNPROC=infinity
          LimitCORE=infinity
          LimitNOFILE=infinity
          TasksMax=infinity
          OOMScoreAdjust=-999

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart containerd

    - name: Kubernetes | Enable containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # Validation
    # -------------------------------------------------------------------------

    - name: Kubernetes | Check containerd version
      ansible.builtin.command:
        cmd: /usr/local/bin/containerd --version
      register: containerd_version_output
      changed_when: false

    - name: Kubernetes | Display containerd version
      ansible.builtin.debug:
        msg: "{{ containerd_version_output.stdout }}"

    # NEW:
    # Validate that the required registry configuration files exist.
    - name: Kubernetes | Check registry.k8s.io hosts configuration
      ansible.builtin.stat:
        path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
      register: registry_k8s_hosts_file
      changed_when: false

    - name: Kubernetes | Check quay.io hosts configuration
      ansible.builtin.stat:
        path: /etc/containerd/certs.d/quay.io/hosts.toml
      register: quay_hosts_file
      changed_when: false

    - name: Kubernetes | Validate registry configuration files
      ansible.builtin.assert:
        that:
          - registry_k8s_hosts_file.stat.exists
          - quay_hosts_file.stat.exists
        fail_msg: >-
          One or more containerd registry hosts.toml files are missing.
        success_msg: >-
          Containerd registry mirror configuration files exist.
