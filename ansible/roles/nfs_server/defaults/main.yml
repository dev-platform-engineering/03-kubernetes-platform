
---
nfs_server_packages:
  - nfs-utils
  - policycoreutils-python-utils
  - firewalld

nfs_server_service: nfs-server

# NFS server configuration
nfs_server_export_root: /srv/nfs/kubernetes
nfs_server_port: 2049
nfs_server_enable_nfsv3: false

# NFSv4 exports.
# The Kubernetes storage directory is the NFSv4 pseudo-root.
nfs_server_exports:
  - path: "{{ nfs_server_export_root }}"
    clients:
      - "10.50.50.0/24"
    options:
      - rw
      - fsid=0
      - sync
      - root_squash
      - no_subtree_check

# Root-squashed requests are mapped to nobody:nobody.
# This identity is used by the NFS CSI provisioner when creating
# dynamic PVC directories.
nfs_server_directory_owner: nobody
nfs_server_directory_group: nobody
nfs_server_directory_mode: "0770"

# Application directories with explicit ownership and permissions.
nfs_server_directories:
  - path: "{{ nfs_server_export_root }}/postgres"
    owner: "26"
    group: "26"
    mode: "0770"

  - path: "{{ nfs_server_export_root }}/postgres-test"
    owner: nobody
    group: nobody
    mode: "0770"

  - path: "{{ nfs_server_export_root }}/redis"
    owner: nobody
    group: nobody
    mode: "0770"

# SELinux
nfs_server_selinux_enabled: true
nfs_server_selinux_type: public_content_rw_t

# Firewall
nfs_server_firewall_enabled: true
nfs_server_firewall_zone: public
