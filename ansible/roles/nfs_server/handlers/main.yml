---
- name: Reload NFS exports
  ansible.builtin.command:
    cmd: exportfs -rav
  changed_when: true

- name: Restart NFS server
  ansible.builtin.systemd:
    name: "{{ nfs_server_service }}"
    state: restarted

- name: Restore NFS export SELinux context
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ nfs_server_export_root }}"
  changed_when: true