---
# -----------------------------------------------------------------------------
# Bootstrap token
# -----------------------------------------------------------------------------

- name: Worker | Generate bootstrap token
  ansible.builtin.command:
    cmd: >-
      kubeadm token create
      --ttl {{ worker_join_token_ttl }}
  delegate_to: "{{ worker_bootstrap_host }}"
  run_once: true
  register: worker_token
  changed_when: false
  no_log: true

- name: Worker | Store bootstrap token
  ansible.builtin.set_fact:
    worker_join_token: "{{ worker_token.stdout | trim }}"
  delegate_to: "{{ worker_bootstrap_host }}"
  delegate_facts: true
  run_once: true
  no_log: true

# -----------------------------------------------------------------------------
# Kubernetes CA public key hash
# -----------------------------------------------------------------------------

- name: Worker | Calculate CA certificate hash
  ansible.builtin.shell:
    cmd: >-
      openssl x509
      -pubkey
      -in /etc/kubernetes/pki/ca.crt |
      openssl rsa
      -pubin
      -outform der 2>/dev/null |
      openssl dgst
      -sha256
      -hex |
      awk '{print $2}'
  delegate_to: "{{ worker_bootstrap_host }}"
  run_once: true
  register: worker_ca_hash
  changed_when: false
  no_log: true

- name: Worker | Store CA certificate hash
  ansible.builtin.set_fact:
    worker_ca_cert_hash: "{{ worker_ca_hash.stdout | trim }}"
  delegate_to: "{{ worker_bootstrap_host }}"
  delegate_facts: true
  run_once: true
  no_log: true

# -----------------------------------------------------------------------------
# Validate credentials
# -----------------------------------------------------------------------------

- name: Worker | Validate join credentials
  ansible.builtin.assert:
    that:
      - hostvars[worker_bootstrap_host].worker_join_token is defined
      - hostvars[worker_bootstrap_host].worker_join_token | length > 0
      - hostvars[worker_bootstrap_host].worker_ca_cert_hash is defined
      - hostvars[worker_bootstrap_host].worker_ca_cert_hash | length == 64
    fail_msg: >-
      Kubeadm worker join credentials were not generated correctly
  run_once: true
