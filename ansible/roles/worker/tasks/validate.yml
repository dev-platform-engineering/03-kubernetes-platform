---
- name: Worker | Validate kubelet configuration
  ansible.builtin.stat:
    path: "{{ worker_kubelet_config }}"
  register: worker_kubelet_conf

- name: Worker | Assert kubelet configuration exists
  ansible.builtin.assert:
    that:
      - worker_kubelet_conf.stat.exists
    fail_msg: >-
      Worker {{ inventory_hostname }} has not been successfully joined
      to the Kubernetes cluster

- name: Worker | Validate kubelet service
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true

- name: Worker | Display installed component versions
  ansible.builtin.debug:
    msg:
      - "kubeadm: {{ worker_kubeadm_version.stdout }}"
      - "kubelet: {{ worker_kubelet_version.stdout }}"
      - "containerd: validated"
      - "kubelet: active"
      - "Kubernetes join: successful"

- name: Worker | Validate Kubernetes node
  ansible.builtin.command:
    cmd: kubectl get node {{ ansible_hostname }} -o json
  delegate_to: "{{ localhost }}"
  register: worker_node
  changed_when: false

- name: Worker | Validate Kubernetes node exists
  ansible.builtin.assert:
    that:
      - worker_node.rc == 0
    fail_msg: >-
      Worker {{ inventory_hostname }} is not registered
      in the Kubernetes cluster
