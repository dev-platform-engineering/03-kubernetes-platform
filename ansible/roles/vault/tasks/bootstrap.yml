---
# =============================================================================
# Vault bootstrap
#
# Flow:
#
#   1. Start vault-01
#   2. Check initialization
#   3. Initialize vault-01
#   4. Keep unseal keys + root token in Ansible memory only
#   5. Unseal vault-01
#   6. Verify vault-01 is unsealed
#   7. Start vault-02 and vault-03 in parallel
#   8. Wait for secondary Vault APIs
#   9. Unseal vault-02 and vault-03 in parallel
#  10. retry_join completes automatically
#  11. Wait for both nodes to appear in Raft
#  12. Validate all Vault nodes are unsealed
#  13. Display final 3-node Raft cluster
#
# IMPORTANT:
#
#   - Unseal keys are never written to disk.
#   - Root token is never written to disk.
#   - Both exist only as Ansible facts during this playbook run.
#   - Secondary nodes use retry_join from vault.hcl.
#
# With Raft + Shamir seal, the secondary must be unsealed so it can
# complete the Raft join challenge.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Start bootstrap node
# -----------------------------------------------------------------------------

- name: Bootstrap | Start Vault on bootstrap node
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 2. Wait for bootstrap API
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for Vault API
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 501
      - 503
    return_content: false
  register: vault_bootstrap_health
  until: vault_bootstrap_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 3. Check initialization state
#
# vault operator init -status:
#
#   rc=0 -> initialized
#   rc=2 -> not initialized
# -----------------------------------------------------------------------------

- name: Bootstrap | Check Vault initialization status
  ansible.builtin.command:
    cmd: vault operator init -status
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init_status
  changed_when: false
  failed_when: vault_init_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Set initialization state
  ansible.builtin.set_fact:
    vault_bootstrap_initialized: "{{ vault_init_status.rc == 0 }}"
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 4. Safety check
#
# If Vault is already initialized, this run cannot recover the generated
# unseal keys because they were intentionally never persisted.
# -----------------------------------------------------------------------------

- name: Bootstrap | Refuse already initialized Vault
  ansible.builtin.fail:
    msg: >-
      Vault on {{ vault_bootstrap_node }} is already initialized.

      This bootstrap playbook only supports first-time initialization because
      the generated unseal keys are intentionally kept in Ansible memory and
      are not stored anywhere.

      Restore the clean Vault snapshot before running the initial bootstrap,
      or configure a secure external unseal-key source for future reruns.
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 5. Initialize Vault
#
# This executes only on vault-01.
# -----------------------------------------------------------------------------

- name: Bootstrap | Initialize Vault
  ansible.builtin.command:
    cmd: >
      vault operator init
      -key-shares={{ vault_init_key_shares }}
      -key-threshold={{ vault_init_key_threshold }}
      -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 6. Store bootstrap credentials in memory
#
# Nothing is written to disk.
#
# vault_unseal_keys:
#   Used to unseal all three nodes.
#
# vault_root_token:
#   Used only for authenticated Raft validation.
# -----------------------------------------------------------------------------

- name: Bootstrap | Store Vault bootstrap credentials in memory
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_init.stdout | from_json).unseal_keys_b64 }}"
    vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 7. Unseal vault-01
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal bootstrap node
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_bootstrap_unseal
  changed_when: true
  no_log: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 8. Verify vault-01 is unsealed
# -----------------------------------------------------------------------------

- name: Bootstrap | Check bootstrap Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_bootstrap_status
  changed_when: false
  failed_when: vault_bootstrap_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Verify bootstrap Vault is unsealed
  ansible.builtin.assert:
    that:
      - not (vault_bootstrap_status.stdout | from_json).sealed
    fail_msg: "Vault bootstrap node is still sealed."
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 9. Start secondary nodes
#
# vault-02 and vault-03 start in parallel.
#
# Their vault.hcl contains retry_join pointing to vault-01.
# -----------------------------------------------------------------------------

- name: Bootstrap | Start secondary Vault nodes
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 10. Wait for secondary APIs
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary Vault APIs
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 501
      - 503
    return_content: false
  register: vault_secondary_health
  until: vault_secondary_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 11. Unseal secondary nodes
#
# IMPORTANT:
#
# Do this BEFORE waiting for retry_join.
#
# With Raft + Shamir seal, the joining node needs the unseal key material
# to complete the encrypted Raft join challenge.
#
# vault-02 and vault-03 execute in parallel.
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal secondary nodes
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ hostvars[vault_bootstrap_node].vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_secondary_unseal
  changed_when: true
  no_log: true
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 12. Verify secondary nodes are unsealed
# -----------------------------------------------------------------------------

- name: Bootstrap | Check secondary Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_secondary_status
  changed_when: false
  failed_when: vault_secondary_status.rc not in [0, 2]
  when: inventory_hostname != vault_bootstrap_node

- name: Bootstrap | Verify secondary Vault is unsealed
  ansible.builtin.assert:
    that:
      - not (vault_secondary_status.stdout | from_json).sealed
    fail_msg: >-
      {{ inventory_hostname }} is still sealed.
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 13. Wait for retry_join to complete
#
# retry_join runs inside Vault itself.
#
# Once vault-02 and vault-03 have been unsealed, Vault can complete the
# Raft challenge/response and add them to the cluster.
#
# The check is executed only against vault-01.
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary nodes to join Raft
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_raft_peers
  changed_when: false
  failed_when: false
  until:
    - vault_raft_peers.rc == 0
    - "'vault-02' in vault_raft_peers.stdout"
    - "'vault-03' in vault_raft_peers.stdout"
  retries: 30
  delay: 2
  no_log: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 14. Final Vault status
#
# Check every node independently.
# -----------------------------------------------------------------------------

- name: Bootstrap | Check Vault node status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_node_status
  changed_when: false
  failed_when: vault_node_status.rc not in [0, 2]

- name: Bootstrap | Verify Vault node is unsealed
  ansible.builtin.assert:
    that:
      - not (vault_node_status.stdout | from_json).sealed
    fail_msg: >-
      {{ inventory_hostname }} is still sealed.

# -----------------------------------------------------------------------------
# 15. Final Raft validation
#
# Authenticated with the root token generated during this bootstrap run.
# -----------------------------------------------------------------------------

- name: Bootstrap | Get final Raft peer list
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_final_raft_peers
  changed_when: false
  no_log: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 16. Display final Raft cluster
#
# The actual peer output is hidden because the command was executed with
# no_log. Instead display a simple success message.
# -----------------------------------------------------------------------------

- name: Bootstrap | Display final Raft cluster status
  ansible.builtin.debug:
    msg:
      - "Vault bootstrap completed successfully."
      - "Bootstrap node: {{ vault_bootstrap_node }}"
      - "Raft cluster expected members: {{ groups['vault_cluster'] | join(', ') }}"
      - "All Vault nodes are initialized and unsealed."
      - "Raft peer validation completed successfully."
  when: inventory_hostname == vault_bootstrap_node
