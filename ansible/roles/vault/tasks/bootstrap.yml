---
# =============================================================================
# Vault bootstrap
#
# FIRST-TIME INITIALIZATION ONLY
#
# Flow:
#
#   1. Select the first inventory host as bootstrap node
#   2. Start bootstrap node
#   3. Wait for bootstrap API
#   4. Check initialization state
#   5. Initialize bootstrap node
#   6. Keep unseal keys + root token in Ansible memory only
#   7. Unseal bootstrap node
#   8. Verify bootstrap node
#   9. Start all secondary nodes in parallel
#  10. Wait for secondary APIs
#  11. Unseal all secondary nodes in parallel
#  12. Wait for secondary nodes to become initialized/unsealed
#  13. Wait for all inventory nodes to appear in Raft
#  14. Validate final Vault state on every node
#  15. Display final cluster status
#
# IMPORTANT:
#
#   - This playbook is intended for FIRST-TIME Vault initialization.
#   - Unseal keys are never written to disk.
#   - Root token is never written to disk.
#   - Bootstrap credentials exist only in Ansible memory.
#   - Secondary nodes join through retry_join in vault.hcl.
#   - The first host in vault_cluster inventory is the bootstrap node.
#
# Example inventory:
#
#   vault_cluster:
#     hosts:
#       vault-01:
#       vault-02:
#       vault-03:
#
# Therefore:
#
#   groups['vault_cluster'][0] = vault-01
#
# No Vault hostname is hardcoded in this playbook.
# =============================================================================

# -----------------------------------------------------------------------------
# 0. Determine bootstrap node from inventory
# -----------------------------------------------------------------------------

- name: Bootstrap | Set bootstrap node from inventory
  ansible.builtin.set_fact:
    vault_bootstrap_node: "{{ groups['vault_cluster'][0] }}"
  run_once: true

# -----------------------------------------------------------------------------
# 1. Start bootstrap node
# -----------------------------------------------------------------------------

- name: Bootstrap | Start Vault on bootstrap node
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 2. Wait for bootstrap API
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for bootstrap Vault API
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 474
      - 501
      - 503
  register: vault_bootstrap_health
  until: vault_bootstrap_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 3. Check initialization state
# -----------------------------------------------------------------------------

- name: Bootstrap | Check Vault initialization status
  ansible.builtin.command:
    cmd: vault operator init -status
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init_status
  changed_when: false
  failed_when: vault_init_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Set initialization state
  ansible.builtin.set_fact:
    vault_bootstrap_initialized: "{{ vault_init_status.rc == 0 }}"
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 4. Safety check
# -----------------------------------------------------------------------------
#
# This prevents accidentally attempting to initialize an existing Vault.
# Restore the clean snapshot before running the initial bootstrap again.
# -----------------------------------------------------------------------------

# - name: Bootstrap | Refuse already initialized Vault
#   ansible.builtin.fail:
#     msg: >-
#       Vault on {{ vault_bootstrap_node }} is already initialized.

#       This bootstrap playbook is for first-time initialization only.

#       The generated unseal keys and root token are intentionally not stored
#       anywhere. Restore the clean Vault snapshot before running the initial
#       bootstrap again, or use a separate secure mechanism for an existing
#       cluster.
#   when:
#     - inventory_hostname == vault_bootstrap_node
#     - vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 4. Initialize Vault
# -----------------------------------------------------------------------------

- name: Bootstrap | Initialize Vault
  ansible.builtin.command:
    cmd: >
      vault operator init
      -key-shares={{ vault_init_key_shares }}
      -key-threshold={{ vault_init_key_threshold }}
      -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# Save Vault bootstrap credentials on Ansible controller
# -----------------------------------------------------------------------------

- name: Bootstrap | Create local credentials directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}/bootstrap"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_init is defined
    - vault_init.rc == 0
  no_log: false

- name: Bootstrap | Save Vault bootstrap credentials
  ansible.builtin.copy:
    content: "{{ vault_init.stdout }}"
    dest: "{{ vault_bootstrap_credentials_file }}"
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_init is defined
    - vault_init.rc == 0
  no_log: true

# -----------------------------------------------------------------------------
# 6. Store bootstrap credentials in memory
# -----------------------------------------------------------------------------

- name: Bootstrap | Store Vault bootstrap credentials in memory
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_init.stdout | from_json).unseal_keys_b64 }}"
    vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 7. Unseal bootstrap node
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal bootstrap node
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_bootstrap_unseal
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 7. Verify bootstrap node
# -----------------------------------------------------------------------------

- name: Bootstrap | Check bootstrap Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_bootstrap_status
  changed_when: false
  failed_when: vault_bootstrap_status.rc not in [0, 2]
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Verify bootstrap Vault
  ansible.builtin.assert:
    that:
      - (vault_bootstrap_status.stdout | from_json).initialized | bool
      - not (vault_bootstrap_status.stdout | from_json).sealed | bool
      - (vault_bootstrap_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Bootstrap Vault is not initialized, unsealed, or using Raft storage.
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 8. Start all secondary nodes
# -----------------------------------------------------------------------------

- name: Bootstrap | Start secondary Vault nodes
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 9. Wait for secondary APIs
#
# HTTP 429 is expected for a healthy standby Vault node.
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary Vault APIs
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 474
      - 501
      - 503
      - 530
    return_content: false
  register: vault_secondary_health
  until: vault_secondary_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 10. Unseal secondary nodes
#
# retry_join in vault.hcl will complete the Raft join after the nodes are
# initialized and unsealed.
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal secondary nodes
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ hostvars[vault_bootstrap_node].vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_secondary_unseal
  changed_when: true
  no_log: true
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

# -----------------------------------------------------------------------------
# 11. Wait for secondary nodes to become initialized and unsealed
#
# The nodes may need several seconds to:
#
#   - complete retry_join
#   - synchronize Raft state
#   - transition to follower/standby
#
# Therefore we explicitly wait instead of checking only once.
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary nodes to become initialized and unsealed
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_secondary_status
  changed_when: false
  failed_when: false
  until:
    - vault_secondary_status.rc == 0
    - (vault_secondary_status.stdout | from_json).initialized | bool
    - not (vault_secondary_status.stdout | from_json).sealed | bool
    - (vault_secondary_status.stdout | from_json).storage_type == "raft"
  retries: 30
  delay: 2
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

# -----------------------------------------------------------------------------
# 12. Validate secondary nodes
# -----------------------------------------------------------------------------

- name: Bootstrap | Verify secondary Vault nodes
  ansible.builtin.assert:
    that:
      - (vault_secondary_status.stdout | from_json).initialized | bool
      - not (vault_secondary_status.stdout | from_json).sealed | bool
      - (vault_secondary_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Vault on {{ inventory_hostname }} did not reach the expected
      initialized, unsealed, Raft state.
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

# -----------------------------------------------------------------------------
# 13. Wait for all inventory nodes to appear in Raft
#
# The Raft peer list is checked from the bootstrap node.
#
# Inventory is the source of truth:
#
#   groups['vault_cluster']
#
# No Vault node names are hardcoded here.
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for all Vault inventory nodes to join Raft
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_raft_peers
  changed_when: false
  failed_when: false
  until:
    - vault_raft_peers.rc == 0
    - groups['vault_cluster']
      | select('in', vault_raft_peers.stdout)
      | list
      | length == groups['vault_cluster'] | length
  retries: 30
  delay: 2
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 14. Final Vault status on every node
# -----------------------------------------------------------------------------

- name: Bootstrap | Get final Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_final_status
  changed_when: false
  failed_when: vault_final_status.rc != 0

# -----------------------------------------------------------------------------
# 15. Validate final Vault state
# -----------------------------------------------------------------------------

- name: Bootstrap | Verify final Vault state
  ansible.builtin.assert:
    that:
      - (vault_final_status.stdout | from_json).initialized | bool
      - not (vault_final_status.stdout | from_json).sealed | bool
      - (vault_final_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Vault on {{ inventory_hostname }} is not in the expected final state.

# -----------------------------------------------------------------------------
# 16. Get final Raft peer list
# -----------------------------------------------------------------------------

- name: Bootstrap | Get final Raft peer list
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_final_raft_peers
  changed_when: false
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 17. Display final cluster status
# -----------------------------------------------------------------------------

- name: Bootstrap | Display final Vault cluster status
  ansible.builtin.debug:
    msg:
      - "Vault bootstrap completed successfully."
      - "Bootstrap node: {{ vault_bootstrap_node }}"
      - "Inventory nodes: {{ groups['vault_cluster'] | join(', ') }}"
      - "All Vault nodes are initialized."
      - "All Vault nodes are unsealed."
      - "All Vault nodes are using Raft storage."
      - "All inventory nodes are present in the Raft peer list."
  when: inventory_hostname == vault_bootstrap_node
