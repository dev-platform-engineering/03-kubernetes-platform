---
# =============================================================================
# Vault bootstrap
#
# Flow:
#
#   1. Start vault-01
#   2. Wait for bootstrap API
#   3. Check initialization
#   4. Initialize vault-01
#   5. Keep unseal keys + root token in Ansible memory only
#   6. Unseal vault-01
#   7. Verify vault-01 is unsealed
#   8. Start vault-02 and vault-03 in parallel
#   9. Wait for secondary APIs
#  10. Unseal vault-02 and vault-03 in parallel
#  11. Wait for secondary nodes to complete Raft join and become unsealed
#  12. Validate 3-node Raft membership
#  13. Validate final Vault state on every node
#  14. Display final cluster status
#
# IMPORTANT:
#
#   - Unseal keys are never written to disk.
#   - Root token is never written to disk.
#   - Both exist only as Ansible facts during this playbook run.
#   - Secondary nodes use retry_join from vault.hcl.
#
# With Raft + Shamir seal, secondary nodes must receive the unseal keys
# before retry_join can complete the Raft join challenge.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Start bootstrap node
# -----------------------------------------------------------------------------

- name: Bootstrap | Start Vault on bootstrap node
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 2. Wait for bootstrap API
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for Vault API
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 501
      - 503
    return_content: false
  register: vault_bootstrap_health
  until: vault_bootstrap_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 3. Check initialization state
#
# vault operator init -status:
#
#   rc=0 -> initialized
#   rc=2 -> not initialized
# -----------------------------------------------------------------------------

- name: Bootstrap | Check Vault initialization status
  ansible.builtin.command:
    cmd: vault operator init -status
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init_status
  changed_when: false
  failed_when: vault_init_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Set initialization state
  ansible.builtin.set_fact:
    vault_bootstrap_initialized: "{{ vault_init_status.rc == 0 }}"
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 4. Safety check
#
# If Vault is already initialized, this run cannot recover the generated
# unseal keys because they were intentionally never persisted.
# -----------------------------------------------------------------------------

- name: Bootstrap | Refuse already initialized Vault
  ansible.builtin.fail:
    msg: >-
      Vault on {{ vault_bootstrap_node }} is already initialized.

      This bootstrap playbook only supports first-time initialization because
      the generated unseal keys are intentionally kept in Ansible memory and
      are not stored anywhere.

      Restore the clean Vault snapshot before running the initial bootstrap,
      or configure a secure external unseal-key source for future reruns.
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 5. Initialize Vault
#
# This executes only on vault-01.
# -----------------------------------------------------------------------------

- name: Bootstrap | Initialize Vault
  ansible.builtin.command:
    cmd: >
      vault operator init
      -key-shares={{ vault_init_key_shares }}
      -key-threshold={{ vault_init_key_threshold }}
      -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

# -----------------------------------------------------------------------------
# 6. Store bootstrap credentials in memory
#
# Nothing is written to disk.
#
# vault_unseal_keys:
#   Used to unseal all three nodes.
#
# vault_root_token:
#   Used only for authenticated Raft validation during this run.
# -----------------------------------------------------------------------------

- name: Bootstrap | Store Vault bootstrap credentials in memory
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_init.stdout | from_json).unseal_keys_b64 }}"
    vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 7. Unseal vault-01
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal bootstrap node
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_bootstrap_unseal
  changed_when: true
  no_log: true
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 8. Verify vault-01 is unsealed
# -----------------------------------------------------------------------------

- name: Bootstrap | Check bootstrap Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_bootstrap_status
  changed_when: false
  failed_when: vault_bootstrap_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Verify bootstrap Vault is unsealed
  ansible.builtin.assert:
    that:
      - (vault_bootstrap_status.stdout | from_json).initialized | bool
      - not (vault_bootstrap_status.stdout | from_json).sealed | bool
      - (vault_bootstrap_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Vault bootstrap node is not initialized, unsealed, or using Raft storage.
  when: inventory_hostname == vault_bootstrap_node

# -----------------------------------------------------------------------------
# 9. Start secondary nodes
#
# vault-02 and vault-03 start in parallel.
#
# Their vault.hcl contains retry_join pointing to vault-01.
# -----------------------------------------------------------------------------

- name: Bootstrap | Start secondary Vault nodes
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 10. Wait for secondary APIs
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary Vault APIs
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 501
      - 503
    return_content: false
  register: vault_secondary_health
  until: vault_secondary_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 11. Unseal secondary nodes
#
# IMPORTANT:
#
# Do this before waiting for Raft membership.
#
# Vault's retry_join process runs inside the Vault service. The joining node
# needs the unseal keys to complete the Raft join challenge.
#
# vault-02 and vault-03 execute in parallel.
# -----------------------------------------------------------------------------

- name: Bootstrap | Unseal secondary nodes
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ hostvars[vault_bootstrap_node].vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_secondary_unseal
  changed_when: true
  no_log: true
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 12. Wait for secondary nodes to complete join and become unsealed
#
# Do not immediately assert sealed=false.
#
# The unseal command can return while Vault is still completing the Raft
# join process. Wait until Vault reports the desired final state.
# -----------------------------------------------------------------------------

- name: Bootstrap | Wait for secondary nodes to become unsealed
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_secondary_status
  changed_when: false
  failed_when: false
  until:
    - vault_secondary_status.rc == 0
    - (vault_secondary_status.stdout | from_json).initialized | bool
    - not (vault_secondary_status.stdout | from_json).sealed | bool
    - (vault_secondary_status.stdout | from_json).storage_type == "raft"
  retries: 30
  delay: 2
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 13. Validate secondary node state
# -----------------------------------------------------------------------------

- name: Bootstrap | Verify secondary Vault is unsealed
  ansible.builtin.assert:
    that:
      - (vault_secondary_status.stdout | from_json).initialized | bool
      - not (vault_secondary_status.stdout | from_json).sealed | bool
      - (vault_secondary_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      {{ inventory_hostname }} did not reach the expected initialized,
      unsealed, Raft state.
  when: inventory_hostname != vault_bootstrap_node

# -----------------------------------------------------------------------------
# 14. Wait for all three nodes to appear in Raft
#
# This is executed only against vault-01.
#
# The root token is used only in memory for this authenticated validation.
# -----------------------------------------------------------------------------

- name: Bootstrap | Build expected Vault Raft peer list
  ansible.builtin.set_fact:
    vault_expected_raft_peers: "{{ groups['vault_cluster'] }}"
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Wait for all Vault nodes to join Raft
  ansible.builtin.command: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_raft_peers
  changed_when: false
  failed_when: false
  until:
    - vault_raft_peers.rc == 0
    - vault_expected_raft_peers
      | select('in', vault_raft_peers.stdout)
      | list
      | length == vault_expected_raft_peers | length
  retries: 30
  delay: 2
  no_log: true
  when: inventory_hostname == vault_bootstrap_node
