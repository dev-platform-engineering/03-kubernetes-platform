---
- name: Bootstrap | Set bootstrap node from inventory
  ansible.builtin.set_fact:
    vault_bootstrap_node: "{{ groups['vault_cluster'][0] }}"
  run_once: true

- name: Bootstrap | Start Vault on bootstrap node
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Wait for bootstrap Vault API
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 472
      - 473
      - 474
      - 501
      - 503
  register: vault_bootstrap_health
  until: vault_bootstrap_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Check Vault initialization status
  ansible.builtin.command:
    cmd: vault operator init -status
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init_status
  changed_when: false
  failed_when: vault_init_status.rc not in [0, 2]
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Set initialization state
  ansible.builtin.set_fact:
    vault_bootstrap_initialized: "{{ vault_init_status.rc == 0 }}"
  when: inventory_hostname == vault_bootstrap_node

- name: Bootstrap | Initialize Vault
  ansible.builtin.command:
    cmd: >
      vault operator init
      -key-shares={{ vault_init_key_shares }}
      -key-threshold={{ vault_init_key_threshold }}
      -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_init
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Create local credentials directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}/bootstrap"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0700"
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_init is defined
    - vault_init.rc | default(1) == 0
  no_log: true

- name: Bootstrap | Save Vault bootstrap credentials
  ansible.builtin.copy:
    content: "{{ vault_init.stdout }}"
    dest: "{{ vault_bootstrap_credentials_file }}"
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_init is defined
    - vault_init.rc | default(1) == 0
  no_log: true

- name: Bootstrap | Store Vault bootstrap credentials in memory
  ansible.builtin.set_fact:
    vault_unseal_keys: "{{ (vault_init.stdout | from_json).unseal_keys_b64 }}"
    vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - vault_init is defined
    - vault_init.rc | default(1) == 0

- name: Bootstrap | Unseal bootstrap node
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_bootstrap_unseal
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Check bootstrap Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_bootstrap_status
  changed_when: false
  failed_when: vault_bootstrap_status.rc not in [0, 2]
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Verify bootstrap Vault
  ansible.builtin.assert:
    that:
      - (vault_bootstrap_status.stdout | from_json).initialized | bool
      - not (vault_bootstrap_status.stdout | from_json).sealed | bool
      - (vault_bootstrap_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Bootstrap Vault is not initialized, unsealed, or using Raft storage.
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Start secondary Vault nodes
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname != vault_bootstrap_node

- name: Bootstrap | Wait for secondary Vault APIs
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/health"
    method: GET
    ca_path: "{{ vault_tls_ca_cert }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 474
      - 501
      - 503
      - 530
    return_content: false
  register: vault_secondary_health
  until: vault_secondary_health.status is defined
  retries: 30
  delay: 2
  when: inventory_hostname != vault_bootstrap_node

- name: Bootstrap | Unseal secondary nodes
  ansible.builtin.command:
    cmd: >
      vault operator unseal
      {{ hostvars[vault_bootstrap_node].vault_unseal_keys[item] }}
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  loop: "{{ range(0, vault_init_key_threshold | int) | list }}"
  register: vault_secondary_unseal
  changed_when: true
  no_log: true
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

- name: Bootstrap | Wait for secondary nodes to become initialized and unsealed
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_secondary_status
  changed_when: false
  failed_when: false
  until:
    - vault_secondary_status.rc == 0
    - (vault_secondary_status.stdout | from_json).initialized | bool
    - not (vault_secondary_status.stdout | from_json).sealed | bool
    - (vault_secondary_status.stdout | from_json).storage_type == "raft"
  retries: 30
  delay: 2
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

- name: Bootstrap | Verify secondary Vault nodes
  ansible.builtin.assert:
    that:
      - (vault_secondary_status.stdout | from_json).initialized | bool
      - not (vault_secondary_status.stdout | from_json).sealed | bool
      - (vault_secondary_status.stdout | from_json).storage_type == "raft"
    fail_msg: >-
      Vault on {{ inventory_hostname }} did not reach the expected
      initialized, unsealed, Raft state.
  when:
    - inventory_hostname != vault_bootstrap_node
    - not (hostvars[vault_bootstrap_node].vault_bootstrap_initialized | bool)

- name: Bootstrap | Wait for all Vault inventory nodes to join Raft
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_raft_peers
  changed_when: false
  failed_when: false
  until:
    - vault_raft_peers.rc == 0
    - groups['vault_cluster']
      | select('in', vault_raft_peers.stdout)
      | list
      | length == groups['vault_cluster'] | length
  retries: 30
  delay: 2
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Get final Vault status
  ansible.builtin.command:
    cmd: vault status -format=json
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
  register: vault_final_status
  changed_when: false
  failed_when: vault_final_status.rc not in [0, 2]

- name: Bootstrap | Verify final Vault state
  ansible.builtin.assert:
    that:
      - (vault_final_status.stdout | from_json).initialized | bool
      - (vault_final_status.stdout | from_json).storage_type == "raft"
      - (vault_final_status.stdout | from_json).ha_enabled | bool
    fail_msg: >-
      Vault on {{ inventory_hostname }} is not in the expected final state.
      initialized={{ (vault_final_status.stdout | from_json).initialized }},
      sealed={{ (vault_final_status.stdout | from_json).sealed }},
      storage_type={{ (vault_final_status.stdout | from_json).storage_type }},
      ha_enabled={{ (vault_final_status.stdout | from_json).ha_enabled }}
    success_msg: >-
      Vault on {{ inventory_hostname }} passed final validation.
      initialized=true,
      sealed={{ (vault_final_status.stdout | from_json).sealed }},
      storage_type=raft,
      ha_enabled=true.

- name: Bootstrap | Get final Raft peer list
  ansible.builtin.command:
    cmd: vault operator raft list-peers
  environment:
    VAULT_ADDR: "{{ vault_api_addr }}"
    VAULT_CACERT: "{{ vault_tls_ca_cert }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: vault_final_raft_peers
  changed_when: false
  no_log: true
  when:
    - inventory_hostname == vault_bootstrap_node
    - not vault_bootstrap_initialized | bool

- name: Bootstrap | Parse final Vault status
  ansible.builtin.set_fact:
    vault_final_status_json: "{{ vault_final_status.stdout | from_json }}"

- name: Bootstrap | Verify final Vault state
  ansible.builtin.assert:
    that:
      - (vault_final_status.stdout | from_json).initialized | bool
      - (vault_final_status.stdout | from_json).storage_type == "raft"
      - (vault_final_status.stdout | from_json).ha_enabled | bool
    fail_msg: >-
      Vault on {{ inventory_hostname }} is not in the expected final state.
      initialized={{ (vault_final_status.stdout | from_json).initialized }},
      sealed={{ (vault_final_status.stdout | from_json).sealed }},
      storage_type={{ (vault_final_status.stdout | from_json).storage_type }},
      ha_enabled={{ (vault_final_status.stdout | from_json).ha_enabled }}
    success_msg: >-
      Vault on {{ inventory_hostname }} passed final validation.
      initialized=true,
      sealed={{ (vault_final_status.stdout | from_json).sealed }},
      storage_type=raft,
      ha_enabled=true.

- name: Bootstrap | Report successful bootstrap
  ansible.builtin.debug:
    msg:
      - "Vault bootstrap completed successfully."
      - "Bootstrap node: {{ vault_bootstrap_node }}"
      - "Inventory nodes: {{ groups['vault_cluster'] | join(', ') }}"
      - "All Vault nodes are initialized."
      - "Vault nodes are using Raft storage."
      - "Vault HA is enabled."
      - "Vault seal state is managed separately."
  when: inventory_hostname == vault_bootstrap_node
