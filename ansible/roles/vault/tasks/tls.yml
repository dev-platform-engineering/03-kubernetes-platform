---
# =============================================================================
# Vault TLS / PKI
#
# Security model:
#
#   - Vault CA private key exists ONLY on Ansible controller
#   - Vault node private keys are generated on the Vault nodes
#   - CSRs are generated on the Vault nodes
#   - CSRs are ALWAYS fetched to the Ansible controller
#   - Certificates are signed on the Ansible controller
#   - Signed certificates are copied back to the Vault nodes
#   - CA certificate is distributed to all Vault nodes
#
# IMPORTANT:
#
#   The controller must NEVER reuse an old node CSR.
#
#   A CSR belongs to a specific private key. Therefore every time the node
#   private key changes, the CSR must be generated from that same key and
#   fetched again to the controller.
#
# =============================================================================

# =============================================================================
# 1. VAULT NODE TLS DIRECTORY
# =============================================================================

- name: TLS | Create Vault TLS directory
  ansible.builtin.file:
    path: "{{ vault_tls_dir }}"
    state: directory
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0750"

# =============================================================================
# 2. CONTROLLER PKI DIRECTORY
# =============================================================================

- name: TLS | Create local Vault PKI directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: TLS | Create local node PKI directory
  ansible.builtin.file:
    path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    mode: "0700"
  delegate_to: localhost
  become: false

# =============================================================================
# 3. VAULT CA
#
# The CA private key is generated and stored ONLY on the Ansible controller.
# =============================================================================

- name: TLS | Generate Vault CA private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_ca_key_local }}"
    type: RSA
    size: "{{ vault_tls_ca_key_size }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: TLS | Generate Vault CA CSR
  community.crypto.openssl_csr:
    path: "{{ vault_tls_controller_pki_dir }}/ca.csr"
    privatekey_path: "{{ vault_tls_ca_key_local }}"
    common_name: "{{ vault_tls_ca_common_name }}"
    digest: sha256

    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true

    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true

    subject:
      commonName: "{{ vault_tls_ca_common_name }}"
      organizationName: "Platform"
      organizationalUnitName: "Vault"

  delegate_to: localhost
  become: false
  run_once: true

- name: TLS | Generate self-signed Vault CA certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_ca_cert_local }}"
    csr_path: "{{ vault_tls_controller_pki_dir }}/ca.csr"
    privatekey_path: "{{ vault_tls_ca_key_local }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ vault_tls_ca_validity_days }}d"
    selfsigned_digest: sha256

  delegate_to: localhost
  become: false
  run_once: true

# =============================================================================
# 4. VAULT SERVER PRIVATE KEY
#
# IMPORTANT:
# The private key is generated on the Vault node.
# It NEVER leaves the Vault node.
# =============================================================================

- name: TLS | Generate Vault server private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_server_key }}"
    type: RSA
    size: "{{ vault_tls_node_key_size }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0600"

# =============================================================================
# 5. VAULT SERVER CSR
#
# The CSR is generated directly from the current private key.
# =============================================================================

- name: TLS | Generate Vault server CSR
  community.crypto.openssl_csr:
    path: "{{ vault_tls_dir }}/server.csr"
    privatekey_path: "{{ vault_tls_server_key }}"
    common_name: "{{ vault_fqdn }}"
    digest: sha256

    basic_constraints:
      - "CA:FALSE"

    key_usage:
      - digitalSignature
      - keyEncipherment

    extended_key_usage:
      - serverAuth
      - clientAuth

    subject_alt_name:
      - "DNS:{{ vault_fqdn }}"
      - "DNS:{{ inventory_hostname }}"
      - "IP:{{ ansible_host }}"

# =============================================================================
# 6. VERIFY CSR MATCHES CURRENT PRIVATE KEY
#
# This catches the exact problem we had:
#
#   old CSR + new private key
#
# before anything is signed.
# =============================================================================

- name: TLS | Verify Vault CSR matches private key
  ansible.builtin.shell:
    cmd: |
      test "$(
        openssl req \
          -noout \
          -modulus \
          -in "{{ vault_tls_dir }}/server.csr" |
        openssl sha256
      )" = "$(
        openssl rsa \
          -noout \
          -modulus \
          -in "{{ vault_tls_server_key }}" |
        openssl sha256
      )"
  args:
    executable: /bin/bash
  changed_when: false

# =============================================================================
# 7. FETCH CURRENT CSR TO CONTROLLER
#
# DO NOT check whether the CSR already exists on the controller.
#
# The CSR must always correspond to the current node private key.
# =============================================================================

- name: TLS | Fetch current Vault server CSR
  ansible.builtin.fetch:
    src: "{{ vault_tls_dir }}/server.csr"
    dest: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.csr"
    flat: true

# =============================================================================
# 8. SIGN SERVER CERTIFICATE ON CONTROLLER
# =============================================================================

- name: TLS | Sign Vault server certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.crt"
    csr_path: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.csr"
    ownca_path: "{{ vault_tls_ca_cert_local }}"
    ownca_privatekey_path: "{{ vault_tls_ca_key_local }}"
    provider: ownca
    ownca_not_after: "+{{ vault_tls_cert_validity_days }}d"
    ownca_digest: sha256

  delegate_to: localhost
  become: false

# =============================================================================
# 9. INSTALL SERVER CERTIFICATE
# =============================================================================

- name: TLS | Install Vault server certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_controller_pki_dir }}/{{ inventory_hostname }}/server.crt"
    dest: "{{ vault_tls_server_cert }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0644"

# =============================================================================
# 10. INSTALL VAULT CA CERTIFICATE
# =============================================================================

- name: TLS | Install Vault CA certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_ca_cert_local }}"
    dest: "{{ vault_tls_ca_cert }}"
    owner: root
    group: root
    mode: "0644"

# =============================================================================
# 11. INSTALL CA INTO ROCKY SYSTEM TRUST
# =============================================================================

- name: TLS | Install Vault CA into system trust store
  ansible.builtin.copy:
    src: "{{ vault_tls_ca_cert_local }}"
    dest: "/etc/pki/ca-trust/source/anchors/platform-vault-ca.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Update system CA trust

# =============================================================================
# 12. VERIFY INSTALLED CERTIFICATE MATCHES PRIVATE KEY
#
# This is the second protection against:
#
#   tls: private key does not match public key
# =============================================================================

- name: TLS | Verify certificate matches private key
  ansible.builtin.shell:
    cmd: |
      test "$(
        openssl x509 \
          -noout \
          -modulus \
          -in "{{ vault_tls_server_cert }}" |
        openssl sha256
      )" = "$(
        openssl rsa \
          -noout \
          -modulus \
          -in "{{ vault_tls_server_key }}" |
        openssl sha256
      )"
  args:
    executable: /bin/bash
  changed_when: false

# =============================================================================
# 13. VERIFY SERVER CERTIFICATE CHAIN
# =============================================================================

- name: TLS | Verify Vault server certificate
  ansible.builtin.command:
    cmd: >
      openssl verify
      -CAfile "{{ vault_tls_ca_cert }}"
      "{{ vault_tls_server_cert }}"
  register: vault_server_cert_verify
  changed_when: false
  failed_when: vault_server_cert_verify.rc != 0

# =============================================================================
# 14. DISPLAY CERTIFICATE INFORMATION
# =============================================================================

- name: TLS | Display Vault server certificate information
  ansible.builtin.command:
    cmd: >
      openssl x509
      -in "{{ vault_tls_server_cert }}"
      -noout
      -subject
      -issuer
      -dates
      -ext subjectAltName
      -ext extendedKeyUsage
  register: vault_server_cert_info
  changed_when: false

- name: TLS | Debug Vault server certificate information
  ansible.builtin.debug:
    var: vault_server_cert_info.stdout_lines
