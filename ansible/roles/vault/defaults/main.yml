---
vault_version: "2.1.1"

vault_user: "vault"
vault_group: "vault"

vault_config_dir: "/etc/vault.d"
vault_data_dir: "/opt/vault/data"
vault_tls_dir: "{{ vault_config_dir }}/tls"

vault_api_port: 8200
vault_cluster_port: 8201

vault_listener_address: "0.0.0.0:8200"
vault_cluster_listener_address: "0.0.0.0:8201"

vault_ui_enabled: true

vault_storage_path: "{{ vault_data_dir }}"

vault_tls_ca_key_size: 4096
vault_tls_node_key_size: 2048

vault_tls_ca_validity_days: 3650
vault_tls_cert_validity_days: 825

vault_tls_server_key: "{{ vault_tls_dir }}/vault.key"
vault_tls_server_cert: "{{ vault_tls_dir }}/vault.crt"
vault_tls_ca_cert: "{{ vault_tls_dir }}/ca.crt"
