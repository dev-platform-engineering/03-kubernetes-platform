---
- name: GitLab | Verify target OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Rocky"
      - ansible_distribution_major_version == "9"
      - ansible_architecture == "x86_64"
    fail_msg: "This role supports Rocky Linux 9 x86_64."

- name: GitLab | Verify minimum lab resources
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= gitlab_min_memory_mb
      - ansible_processor_vcpus >= gitlab_min_vcpus
    fail_msg: >-
      GitLab lab deployment requires at least
      {{ gitlab_min_vcpus }} vCPU and
      {{ gitlab_min_memory_mb }} MiB RAM.

- name: GitLab | Verify RPM URL and checksum
  ansible.builtin.assert:
    that:
      - gitlab_rpm_url is match('^https?://')
      - gitlab_rpm_sha256 is match('^[a-fA-F0-9]{64}$')
      - gitlab_rpm_filename | length > 0
    fail_msg: >-
      Configure the internal Nexus RPM URL and its verified SHA-256 checksum.

- name: GitLab | Check available root filesystem space
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_mounts
          | selectattr('mount', 'equalto', '/')
          | map(attribute='size_available')
          | first
          | default(0)
        ) >= gitlab_min_root_free_bytes
    fail_msg: >-
      At least {{ gitlab_min_root_free_bytes // (1024 * 1024 * 1024) }} GiB
      must be free on the root filesystem. Check /var storage as well if it
      uses a separate filesystem.

- name: GitLab | Install operating system dependencies
  ansible.builtin.dnf:
    name:
      - curl
      - openssh-server
      - policycoreutils
      - perl
      - tzdata
      - git
      - python3-cryptography
    state: present

- name: Configure GitLab proxy environment
  ansible.builtin.set_fact:
    gitlab_proxy_environment:
      http_proxy: "{{ inet_proxy.http_proxy }}"
      https_proxy: "{{ inet_proxy.https_proxy }}"
      no_proxy: "{{ inet_proxy.no_proxy | join(',') }}"
      HTTP_PROXY: "{{ inet_proxy.http_proxy }}"
      HTTPS_PROXY: "{{ inet_proxy.https_proxy }}"
      NO_PROXY: "{{ inet_proxy.no_proxy | join(',') }}"
  when: gitlab_proxy_enabled | bool

- name: GitLab | Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true

- name: GitLab | Download verified RPM from internal Nexus
  ansible.builtin.get_url:
    url: "{{ gitlab_rpm_url }}"
    dest: "{{ gitlab_rpm_path }}"
    checksum: "sha256:{{ gitlab_rpm_sha256 }}"
    mode: "0644"
    force: false
  register: gitlab_rpm_download

- name: GitLab | Download package signing key from Nexus
  ansible.builtin.get_url:
    url: "{{ gitlab_gpg_key_url }}"
    dest: /var/tmp/gitlab-package-signing-key.gpg
    mode: "0644"

- name: GitLab | Import package signing key
  ansible.builtin.rpm_key:
    state: present
    key: /var/tmp/gitlab-package-signing-key.gpg

- name: GitLab | Install Community Edition package
  ansible.builtin.dnf:
    name: "{{ gitlab_rpm_path }}"
    state: present
    disable_gpg_check: false
  notify: GitLab | Reconfigure

- name: GitLab | Configure external URL
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  notify: GitLab | Reconfigure

- name: GitLab | Apply pending configuration
  ansible.builtin.meta: flush_handlers

- name: GitLab | Ensure service is enabled and running
  ansible.builtin.service:
    name: gitlab-runsvdir
    state: started
    enabled: true

- name: GitLab | Wait for HTTP endpoint
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/users/sign_in"
    method: GET
    status_code:
      - 200
      - 302
    timeout: "{{ gitlab_health_timeout }}"
  register: gitlab_health
  until: gitlab_health.status | default(0) in [200, 302]
  retries: "{{ gitlab_health_retries }}"
  delay: "{{ gitlab_health_delay }}"
  changed_when: false

- name: GitLab | Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: gitlab_manage_firewall | bool

- name: GitLab | Ensure firewalld is enabled and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: gitlab_manage_firewall | bool

- name: GitLab | Allow HTTP and HTTPS in firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: "{{ gitlab_firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ gitlab_firewall_services }}"
  when: gitlab_manage_firewall | bool

- name: GitLab | Configure TLS
  ansible.builtin.import_tasks: tls.yml
  when: gitlab_https_enabled | bool