apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
    targetRevision: feature/gitops
    path: gitops/resources/platform/external-secrets/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

