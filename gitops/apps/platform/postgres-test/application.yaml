apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
    targetRevision: feature/gitops
    path: gitops/resources/workloads/postgres-test
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true