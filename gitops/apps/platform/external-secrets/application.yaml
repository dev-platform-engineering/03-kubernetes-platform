
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    # Vendored External Secrets Operator Helm chart.
    - repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
      targetRevision: feature/gitops
      path: gitops/vendor/charts/external-secrets
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/gitops/resources/platform/external-secrets/values.yaml

    # Separate Git source for Helm values.
    - repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
      targetRevision: feature/gitops
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
