apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-test
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
    targetRevision: feature/gitops
    path: gitops/resources/platform/storage/nfs-test

  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
