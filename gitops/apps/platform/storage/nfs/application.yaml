apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    # Helm chart vendored in the GitLab repository.
    - repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
      targetRevision: feature/gitops
      path: gitops/vendor/charts/csi-driver-nfs
      helm:
        releaseName: csi-driver-nfs
        valueFiles:
          - $values/gitops/resources/platform/storage/nfs/values.yaml

    # Separate Git source for Helm values.
    - repoURL: https://gitlab.infra.platform.internal/dev-platform-engineering/03-kubernetes-platform.git
      targetRevision: feature/gitops
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true