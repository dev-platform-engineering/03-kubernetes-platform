
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-test
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: k8s-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: redis-test
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis-test
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: k8s-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7.4.12-bookworm
          imagePullPolicy: IfNotPresent

          command:
            - redis-server
          args:
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "yes"
            - --aclfile
            - /run/redis-auth/users.acl
            - --dir
            - /data
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 160mb
            - --maxmemory-policy
            - allkeys-lru

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password

          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-auth
              mountPath: /run/redis-auth
              readOnly: true

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli ping | grep -qx PONG
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli ping | grep -qx PONG
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - redis-cli ping | grep -qx PONG
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

        - name: redis-auth
          secret:
            secretName: redis-auth
            defaultMode: 0440
            items:
              - key: users.acl
                path: users.acl
