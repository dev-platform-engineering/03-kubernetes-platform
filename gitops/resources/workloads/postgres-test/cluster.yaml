apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-test
  namespace: postgres-test
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16.9

  bootstrap:
    initdb:
      database: app
      owner: app

  storage:
    storageClass: nfs-csi
    size: 5Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 8i
      cpu: "1"

  monitoring:
    enablePodMonitor: false
    