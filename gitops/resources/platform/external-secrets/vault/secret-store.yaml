apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-platform
spec:
  provider:
    vault:
      server: "https://vault.infra.platform.internal:8200"
      path: platform
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: redis-test
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - https://kubernetes.default.svc.cluster.local