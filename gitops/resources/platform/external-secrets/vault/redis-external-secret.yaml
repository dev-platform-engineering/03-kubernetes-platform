apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: redis-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-platform
    kind: SecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: redis
        property: password
    - secretKey: users.acl
      remoteRef:
        key: redis
        property: users.acl
