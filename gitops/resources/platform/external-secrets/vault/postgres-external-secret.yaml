
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: postgres-test
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-platform
    kind: ClusterSecretStore

  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"

  data:
    - secretKey: username
      remoteRef:
        key: postgres-app
        property: username

    - secretKey: password
      remoteRef:
        key: postgres-app
        property: password
