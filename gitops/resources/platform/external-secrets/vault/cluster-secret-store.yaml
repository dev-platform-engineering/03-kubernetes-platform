provider:
  vault:
    server: https://vault.infra.platform.internal:8200
    path: platform
    version: v2
    caProvider:
      type: ConfigMap
      name: vault-ca
      namespace: external-secrets
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: eso-platform
        serviceAccountRef:
          name: external-secrets