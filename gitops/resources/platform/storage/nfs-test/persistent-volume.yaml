
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-test-pv
  labels:
    app.kubernetes.io/part-of: platform-storage
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 10.50.90.20
    path: /kubernetes/postgres-test
