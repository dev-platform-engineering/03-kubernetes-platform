
apiVersion: v1
kind: Pod
metadata:
  name: nfs-test
  namespace: nfs-test
  labels:
    app: nfs-test
spec:
  containers:
    - name: nfs-test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "NFS test started"
          date > /mnt/nfs/test-file.txt
          echo "Persistent storage test" >> /mnt/nfs/test-file.txt
          cat /mnt/nfs/test-file.txt
          sleep 3600
      volumeMounts:
        - name: nfs-volume
          mountPath: /mnt/nfs
  volumes:
    - name: nfs-volume
      persistentVolumeClaim:
        claimName: nfs-test-pvc
