- name: Configure Production VRRP
  vyos.vyos.vyos_config:
    lines: |
      {% for item in vgt_vlans %}
      set high-availability vrrp group VLAN{{ item.id }} interface eth1.{{ item.id }}
      set high-availability vrrp group VLAN{{ item.id }} vrid {{ item.id }}
      set high-availability vrrp group VLAN{{ item.id }} priority {{ router_priority }}
      set high-availability vrrp group VLAN{{ item.id }} address {{ item.subnet }}.254/24
      set high-availability vrrp group VLAN{{ item.id }} hello-source-address {{ item.subnet }}.{{ ip_suffix }}

      {# Master router behavior (higher priority) #}
      {% if router_priority | int > 100 %}
      set high-availability vrrp group VLAN{{ item.id }} preempt-delay 60
      {# Backup router behavior (lower priority) #}
      {% else %}
      set high-availability vrrp group VLAN{{ item.id }} no-preempt
      {% endif %}

      {% endfor %}
    match: none

- name: Save configuration
  vyos.vyos.vyos_config:
    save: true
