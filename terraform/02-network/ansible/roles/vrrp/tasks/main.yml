- name: Configure Production VRRP
  vyos.vyos.vyos_config:
    lines: |
      {% for item in vgt_vlans %}
      set high-availability vrrp group VLAN{{ item.id }} interface eth1.{{ item.id }}
      set high-availability vrrp group VLAN{{ item.id }} vrid {{ item.id }}
      set high-availability vrrp group VLAN{{ item.id }} priority {{ router_priority }}
      set high-availability vrrp group VLAN{{ item.id }} address {{ item.subnet }}.254/24
      set high-availability vrrp group VLAN{{ item.id }} hello-source-address {{ item.subnet }}.{{ ip_suffix }}

      {# Master router behavior (higher priority) #}
      {% if router_priority | int > 100 %}
      set high-availability vrrp group VLAN{{ item.id }} preempt-delay 30
      {# Backup router behavior (lower priority) #}
      {% else %}
      set high-availability vrrp group VLAN{{ item.id }} no-preempt
      {% endif %}

      {% endfor %}
    match: none

- name: Configure External Services VRRP
  vyos.vyos.vyos_config:
    lines: |
      set high-availability vrrp group ExternalService interface {{ external_services.interface }}
      set high-availability vrrp group ExternalService vrid {{ external_services.vrrp.vrid }}
      set high-availability vrrp group ExternalService priority {{ router_priority }}
      set high-availability vrrp group ExternalService address {{ external_services.vrrp.vip }}/24
      {%- if router_priority | int > 100 %}
      set high-availability vrrp group ExternalService preempt-delay 30
      {%- else %}
      set high-availability vrrp group ExternalService no-preempt
      {%- endif %}

- name: Save configuration
  vyos.vyos.vyos_config:
    save: true

- name: Wait for VRRP preempt-delay to converge
  ansible.builtin.pause:
    seconds: 25

- name: Verify VRRP status
  vyos.vyos.vyos_command:
    commands:
      - show vrrp
  register: vrrp_status

- name: Display VRRP status output
  ansible.builtin.debug:
    var: vrrp_status.stdout_lines

- name: Enforce VRRP States for Production
  ansible.builtin.assert:
    that:
      - >
        (inventory_hostname == 'vyos_router_01' and 'BACKUP' not in vrrp_status.stdout[0]) 
        or 
        (inventory_hostname == 'vyos_router_02' and 'MASTER' not in vrrp_status.stdout[0])
    fail_msg: >
      VRRP Verification Failed! Either router 01 is not MASTER, or router 02 is not BACKUP. 
      Check 'show vrrp' status manually.
    success_msg: "VRRP State Verified successfully! Router states match production roles."

- name: Print VRRP Summary Table for Peace of Mind
  ansible.builtin.debug:
    msg: "{{ vrrp_status.stdout_lines[0] }}"
