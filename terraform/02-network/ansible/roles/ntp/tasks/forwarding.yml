---
- name: Configure External NTP upstream servers
  vyos.vyos.vyos_config:
    parents:
      - service ntp
    lines: |
      {% for server in external_ntp.forwarding.upstream_servers %}
      server {{ server }}
      {% endfor %}

- name: Configure External NTP listen address
  vyos.vyos.vyos_config:
    parents:
      - service ntp
    lines:
      - "listen-address '{{ external_ntp.addresses.vip }}'"

- name: Configure External NTP allowed clients
  vyos.vyos.vyos_config:
    parents:
      - service ntp
    lines: |
      {% for subnet in external_ntp.forwarding.allow_from %}
      allow-client address '{{ subnet }}'
      {% endfor %}
