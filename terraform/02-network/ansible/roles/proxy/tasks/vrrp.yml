---
- name: Gather Proxy VRRP configuration
  vyos.vyos.vyos_command:
    commands:
      - 'show configuration commands | match "high-availability vrrp group {{ external_proxy.group }}"'
  register: proxy_vrrp_config

- name: Configure Global VRRP GARP Parameters
  vyos.vyos.vyos_config:
    lines:
      - "set high-availability vrrp global-parameters garp master-delay 1"
      - "set high-availability vrrp global-parameters garp master-repeat 5"

- name: Configure External Proxy VRRP Group
  vars:
    preempt_cmd: >-
      {{
        'set high-availability vrrp group ' ~ external_proxy.group ~ ' preempt-delay 30'
        if router_priority | int > 100
        else
        'set high-availability vrrp group ' ~ external_proxy.group ~ ' no-preempt'
      }}

  vyos.vyos.vyos_config:
    lines:
      - "set high-availability vrrp group {{ external_proxy.group }} interface {{ external_proxy.interface }}.{{ external_proxy.vlan_id }}"
      - "set high-availability vrrp group {{ external_proxy.group }} vrid {{ external_proxy.vrrp.vrid }}"
      - "set high-availability vrrp group {{ external_proxy.group }} priority {{ router_priority }}"
      - "set high-availability vrrp group {{ external_proxy.group }} address {{ external_proxy.addresses.vip }}/24"
      - "{{ preempt_cmd }}"

      # Physical infrastructure failure tracking
      - "set high-availability vrrp group {{ external_proxy.group }} track interface {{ external_proxy.interface }}.{{ external_proxy.vlan_id }}"

      # Trigger explicit service restart on backup nodes during failover
      - "set high-availability vrrp group {{ external_proxy.group }} transition-script master '/bin/systemctl restart haproxy'"

      # Cleanup blocks
      - "delete high-availability vrrp sync-group ClusterSync"
      - "delete high-availability vrrp group {{ external_proxy.group }} health-check"
  when: >
    proxy_vrrp_config.stdout is defined and
    (proxy_vrrp_config.stdout | length > 0) and
    (external_proxy.addresses.vip not in (proxy_vrrp_config.stdout | first))
  register: proxy_vrrp
