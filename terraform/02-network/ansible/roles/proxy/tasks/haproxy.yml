---
- name: Gather HAProxy configuration
  vyos.vyos.vyos_command:
    commands:
      - 'show configuration commands | match "load-balancing haproxy"'
  register: proxy_config

- name: Allow HAProxy to bind to VIP on backup node
  vyos.vyos.vyos_config:
    lines:
      - "set system sysctl parameter net.ipv4.ip_nonlocal_bind value 1"

- name: Configure HAProxy Service and Backend
  vyos.vyos.vyos_config:
    lines:
      # Backend (Without check directives to prevent routing collision blocks)
      - "set load-balancing haproxy backend proxy-backend mode tcp"
      - "set load-balancing haproxy backend proxy-backend balance round-robin"
      - "set load-balancing haproxy backend proxy-backend server proxy01 address {{ external_proxy.forwarding.upstream_server }}"
      - "set load-balancing haproxy backend proxy-backend server proxy01 port {{ external_proxy.forwarding.upstream_port }}"

      # Service
      - "set load-balancing haproxy service proxy-service mode tcp"
      - "set load-balancing haproxy service proxy-service listen-address {{ external_proxy.addresses.vip }}"
      - "set load-balancing haproxy service proxy-service port {{ external_proxy.forwarding.listen_port }}"
      - "set load-balancing haproxy service proxy-service backend proxy-backend"
  register: proxy_service

- name: Configure Outbound NAT Masquerade on Upstream Interface
  vyos.vyos.vyos_config:
    lines:
      # Dynamically maps masquerading rule to the external gateway interface
      - "set nat source rule 100 outbound-interface name '{{ external_proxy.upstream_interface }}'"
      - "set nat source rule 100 source address '{{ external_proxy.forwarding.allow_from | first }}'"
      - "set nat source rule 100 destination address '{{ external_proxy.forwarding.upstream_server }}'"
      - "set nat source rule 100 translation address 'masquerade'"
  register: proxy_nat

- name: Configure Conntrack Synchronization between VyOS nodes
  vyos.vyos.vyos_config:
    lines:
      # Запускаем синхронизацию файрвола через сервисный VLAN 60
      - set service conntrack-sync interface 'eth1.60'

      # Используем мультикаст-группу для обмена таблицами соединений в реальном времени
      - set service conntrack-sync mcast-group '225.0.0.50'

      # Синхронизировать TCP-сессии мгновенно при их появлении
      - set service conntrack-sync sync-queue-size '8192'
  register: proxy_conntrack
