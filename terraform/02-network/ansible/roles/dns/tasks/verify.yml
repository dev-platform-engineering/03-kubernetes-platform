---
- name: Verify DNS VRRP
  vyos.vyos.vyos_command:
    commands:
      - show vrrp
  register: dns_vrrp

- name: Verify DNS Forwarding
  vyos.vyos.vyos_command:
    commands:
      - show configuration commands | match dns
  register: dns_config

- name: Verify upstream DNS connectivity
  vyos.vyos.vyos_command:
    commands:
      - "ping 192.168.13.2 count 3"
  register: dns_ping

- name: Verify forwarding
  vyos.vyos.vyos_command:
    commands:
      - "dig @10.50.60.53 github.com +short"
  register: dns_lookup

- name: Verify DNS resolution
  vyos.vyos.vyos_command:
    commands:
      - "dig @{{ external_dns.addresses.vip }} google.com +short"
  register: dns_lookup
  ignore_errors: true

- name: Display DNS Configuration
  debug:
    var: dns_config.stdout_lines

- name: Display DNS Lookup
  debug:
    var: dns_lookup.stdout_lines
