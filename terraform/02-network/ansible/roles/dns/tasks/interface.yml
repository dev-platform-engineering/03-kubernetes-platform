---
- name: Configure External DNS service IP
  vyos.vyos.vyos_l3_interfaces:
    config:
      - name: "{{ external_dns.interface }}"
        ipv4:
          - address: >-
              {{
                (
                  external_dns.router_ips.primary
                  if ip_suffix | int == 1
                  else external_dns.router_ips.secondary
                ) ~ '/24'
              }}
    state: merged

- name: Save configuration
  vyos.vyos.vyos_config:
    save: true
